name: Build Android APK with Icon & Splash

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets & Initialize Capacitor
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Project Alpha" "com.taqi.projectalpha" --web-dir "www"
          npx cap add android

      - name: Generate Icon & Splash Screen
        run: |
          mkdir -p assets
          if [ -f "icon.png" ] && [ -f "splash.png" ]; then
            cp icon.png assets/icon.png
            cp splash.png assets/splash.png
            npx capacitor-assets generate --android
          else
            echo "Icon or Splash file missing, skipping assets generation..."
          fi

      - name: Force Landscape Orientation
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /g' $MANIFEST_PATH
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectAlpha-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
