name: Build Clean APK with Icon 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.stickman6.nexura "LAST WARRIOR"
          
          # 2. Copy Web Source Assets
          cp -r index.html app/www/ 2>/dev/null || true
          cp -r characters gun bg stage app/www/ 2>/dev/null || true
          
          # 3. Add Custom Icon if present
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' app/config.xml
          fi
          
          # 4. Set Landscape Orientation in config.xml
          sed -i '/<\/widget>/i \    <preference name="Orientation" value="landscape" \/>' app/config.xml

          # 5. Add Android Platform & Build
          cd app
          cordova platform add android
          
          # Fix Gradle executable permissions
          if [ -d "platforms/android" ]; then
            chmod +x platforms/android/gradlew || true
          fi

          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-Shooter-GAME
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
