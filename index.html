<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Project Alpha</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1b1035 0%, #080511 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .active {
      display: flex;
    }

    /* Modern Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 255, 204, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title-box h1 {
      font-size: 2.5rem;
      letter-spacing: 3px;
      color: #00ffcc;
      text-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
    }

    .title-box p {
      font-size: 0.9rem;
      color: #00ffcc;
      margin-top: 5px;
      margin-bottom: 25px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    .btn:hover {
      background: #00cca3;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
    }

    .btn-secondary {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .btn-secondary:hover {
      background: #cc0044;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      background: rgba(15, 12, 41, 0.8);
      color: #fff;
      outline: none;
      text-align: center;
      font-size: 1rem;
    }

    /* Fullscreen Store Styling */
    .fullscreen-store {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #1a103c 0%, #05030a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .store-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
    }

    .store-display {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .full-item-img {
      max-width: 85%;
      max-height: 55vh;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.5));
      margin-bottom: 20px;
    }

    .item-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .store-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding-bottom: 20px;
    }

    /* Stage Screen */
    #stage-screen {
      background-size: cover;
      background-position: center;
      transition: background 0.3s ease;
    }

    .stage-overlay {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .game-arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      flex: 1;
    }

    .character-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
    }

    .character-box img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
    }

    select {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      background: #0f0c29;
      color: #fff;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Entry Options -->
  <div id="entry-screen" class="screen active">
    <div class="card">
      <div class="title-box">
        <h1>PROJECT ALPHA</h1>
        <p>Created by Muhammad Taqi</p>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="showScreen('name-screen')">1. Write Name</button>
        <button class="btn" onclick="showScreen('login-screen')">2. Login with ID</button>
      </div>
    </div>
  </div>

  <!-- Name Entry Screen -->
  <div id="name-screen" class="screen">
    <div class="card">
      <h2 style="margin-bottom: 15px; color:#00ffcc;">Enter Name</h2>
      <input type="text" id="username-input" placeholder="Type your name...">
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn" onclick="registerUser()">Start Game</button>
        <button class="btn btn-secondary" onclick="showScreen('entry-screen')">Back</button>
      </div>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="card">
      <h2 style="margin-bottom: 15px; color:#00ffcc;">Enter Saved ID</h2>
      <input type="text" id="id-input" placeholder="taqi+ohh you are genuis,default+default+e---+e">
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn" onclick="loginWithID()">Login</button>
        <button class="btn btn-secondary" onclick="showScreen('entry-screen')">Back</button>
      </div>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="main-menu" class="screen">
    <div class="title-box">
      <h1>PROJECT ALPHA</h1>
      <p>Created by Muhammad Taqi</p>
    </div>

    <div class="stats-bar" style="width: 320px;">
      <span>User: <strong id="user-display" style="color:#00ffcc;">taqi</strong></span>
      <span>Coins: <strong id="coin-display" style="color:#00ffcc;">5000</strong></span>
      <span>Stage: <strong id="stage-display" style="color:#00ffcc;">5</strong></span>
    </div>

    <div class="btn-group" style="width: 280px;">
      <button class="btn" onclick="openStage()">Play Game</button>
      <button class="btn" onclick="openStore('guns')">Guns Store</button>
      <button class="btn" onclick="openStore('characters')">Characters Store</button>
      <button class="btn btn-secondary" onclick="saveUserIdentity()">Save Game ID</button>
      <button class="btn btn-secondary" style="background:#444;" onclick="showScreen('entry-screen')">Logout</button>
    </div>
  </div>

  <!-- Fullscreen Guns/Characters Store -->
  <div id="store-screen" class="screen">
    <div class="fullscreen-store">
      <div class="store-header">
        <h2 id="store-title" style="color: #00ffcc;">Store</h2>
        <button class="btn" onclick="showScreen('main-menu')">Home</button>
      </div>

      <div class="store-display">
        <img id="store-img" class="full-item-img" src="" alt="Item">
        <div id="item-name" class="item-title">Item Name</div>
        <div id="item-status" style="color: #00ffcc; font-weight: bold; margin-bottom: 15px;"></div>
      </div>

      <div class="store-footer">
        <button class="btn" onclick="prevItem()">Previous</button>
        <button id="buy-btn" class="btn btn-secondary" onclick="buyOrEquip()">Buy</button>
        <button class="btn" onclick="nextItem()">Next</button>
      </div>
    </div>
  </div>

  <!-- Stage Screen -->
  <div id="stage-screen" class="screen">
    <div class="stage-overlay">
      <div class="store-header">
        <div>
          <label style="font-weight: bold; margin-right: 8px;">Select Background: </label>
          <select id="bg-selector" onchange="changeBackground(this.value)">
            <option value="bg/ground.jfif">Ground</option>
            <option value="bg/ground1.jfif">Ground 1</option>
            <option value="bg/ground2.jfif">Ground 2</option>
            <option value="bg/desert.jfif">Desert</option>
          </select>
        </div>
        <button class="btn" onclick="showScreen('main-menu')">Home</button>
      </div>

      <div class="game-arena">
        <div class="character-box">
          <h3 style="color:#00ffcc;">USER</h3>
          <img id="user-stage-img" src="stage/user.jpg" alt="User">
        </div>
        
        <h1 style="color:#ff0055; font-size: 3rem; text-shadow: 0 0 10px #ff0055;">VS</h1>

        <div class="character-box">
          <h3 style="color:#ff0055;">ENEMY BOT</h3>
          <img id="enemy-stage-img" src="stage/enemy.jpg" alt="Enemy">
        </div>
      </div>
    </div>
  </div>

  <script>
    // Game State
    const userData = {
      username: "taqi",
      coins: 5000,
      stage: 5,
      equippedGun: "ak47.jfif",
      equippedCharacter: "character.jfif",
      ownedGuns: ["ak47.jfif", "svd.jfif"],
      ownedCharacters: ["character.jfif"]
    };

    // ID Aliases Mappings
    const gunAliasMap = {
      "ak47.jfif": "default",
      "aug.jfif": "today beautifull day",
      "awm.jfif": "head hunter mein",
      "m4a1.jfif": "army wala hon",
      "machine gun.jfif": "aik dfa shroo hon tou phir",
      "mp40.jfif": "i am bird ok",
      "mp5-evo.jfif": "everyone know me",
      "mp5.jfif": "i am a dragon",
      "scar.jfif": "i am king of forest",
      "svd.jfif": "ohh you are genuis",
      "tactical.jfif": "ok my boss thanks"
    };

    const charAliasMap = {
      "akshay kumar.jfif": "i am hero",
      "bot.jfif": "i am ai",
      "character.jfif": "default",
      "head.jfif": "tum mujhy nahi janty",
      "ira.jfif": "you are not kamyar",
      "mark.jfif": "i am a black dot",
      "master.jfif": "i am head of all",
      "mister z.jfif": "you are not gen z",
      "salman khan.jfif": "me are king",
      "sira.jfif": "i am girl ok",
      "sonia.jfif": "everyone see me on tv",
      "tiger shroff.jfif": "i am floop actor"
    };

    const gunReverseMap = Object.fromEntries(Object.entries(gunAliasMap).map(([k, v]) => [v, k]));
    const charReverseMap = Object.fromEntries(Object.entries(charAliasMap).map(([k, v]) => [v, k]));

    const digitMap = { '1':'a', '2':'b', '3':'c', '4':'d', '5':'e', '6':'f', '7':'g', '8':'h', '9':'i', '0':'-' };
    const digitReverseMap = Object.fromEntries(Object.entries(digitMap).map(([k, v]) => [v, k]));

    const gunFiles = Object.keys(gunAliasMap);
    const characterFiles = Object.keys(charAliasMap);

    let currentStoreType = "";
    let currentIndex = 0;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateDashboardUI() {
      document.getElementById('user-display').innerText = userData.username;
      document.getElementById('coin-display').innerText = userData.coins;
      document.getElementById('stage-display').innerText = userData.stage;
    }

    function registerUser() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert("Please enter a name!");
      userData.username = name;
      userData.coins = 5000;
      userData.stage = 5;
      userData.ownedGuns = ["ak47.jfif", "svd.jfif"];
      userData.equippedGun = "svd.jfif";
      userData.ownedCharacters = ["character.jfif"];
      userData.equippedCharacter = "character.jfif";

      updateDashboardUI();
      showScreen('main-menu');
    }

    // Encoding Logic
    function encodeCoins(num) {
      return String(num).split('').map(d => digitMap[d] || '').join('');
    }

    function decodeCoins(str) {
      return parseInt(str.split('').map(c => digitReverseMap[c] || '').join('')) || 0;
    }

    function encodeStage(stageNum) {
      let code = "";
      let n = stageNum;
      while (n > 0) {
        let rem = (n - 1) % 26;
        code = String.fromCharCode(97 + rem) + code;
        n = Math.floor((n - 1) / 26);
      }
      return code || "a";
    }

    function decodeStage(code) {
      let stage = 0;
      for (let i = 0; i < code.length; i++) {
        stage = stage * 26 + (code.charCodeAt(i) - 96);
      }
      return stage || 1;
    }

    function saveUserIdentity() {
      const gunsCode = userData.ownedGuns.map(g => gunAliasMap[g] || g).join(',');
      const charCode = charAliasMap[userData.equippedCharacter] || userData.equippedCharacter;
      const coinCode = encodeCoins(userData.coins);
      const stageCode = encodeStage(userData.stage);

      const generatedID = `${userData.username}+${gunsCode}+${charCode}+${coinCode}+${stageCode}`;
      
      navigator.clipboard.writeText(generatedID).catch(()=>{});
      alert("Your Generated ID:\n\n" + generatedID);
    }

    function loginWithID() {
      const rawID = document.getElementById('id-input').value.trim();
      if (!rawID) return alert("Please enter an ID!");

      const parts = rawID.split('+');
      if (parts.length < 5) return alert("Invalid ID format!");

      userData.username = parts[0];
      
      const gunAliases = parts[1].split(',');
      userData.ownedGuns = gunAliases.map(a => gunReverseMap[a] || a);
      userData.equippedGun = userData.ownedGuns[0] || "ak47.jfif";

      const charAlias = parts[2];
      userData.equippedCharacter = charReverseMap[charAlias] || charAlias;
      if (!userData.ownedCharacters.includes(userData.equippedCharacter)) {
        userData.ownedCharacters.push(userData.equippedCharacter);
      }

      userData.coins = decodeCoins(parts[3]);
      userData.stage = decodeStage(parts[4]);

      updateDashboardUI();
      showScreen('main-menu');
    }

    // Fullscreen Stores Mechanics
    function openStore(type) {
      currentStoreType = type;
      currentIndex = 0;
      document.getElementById('store-title').innerText = type === 'guns' ? 'Guns Store' : 'Characters Store';
      showScreen('store-screen');
      updateStoreItem();
    }

    function updateStoreItem() {
      const list = currentStoreType === 'guns' ? gunFiles : characterFiles;
      const folder = currentStoreType === 'guns' ? 'gun/' : 'characters/';
      const fileName = list[currentIndex];
      
      document.getElementById('store-img').src = folder + fileName;
      document.getElementById('item-name').innerText = fileName;

      const isOwned = currentStoreType === 'guns' 
        ? userData.ownedGuns.includes(fileName)
        : userData.ownedCharacters.includes(fileName);

      const buyBtn = document.getElementById('buy-btn');
      const statusText = document.getElementById('item-status');

      if (isOwned) {
        statusText.innerText = "Status: OWNED";
        buyBtn.innerText = "Equip";
        buyBtn.style.background = "#00ffcc";
        buyBtn.style.color = "#000";
      } else {
        statusText.innerText = "Price: 200 Coins";
        buyBtn.innerText = "Buy";
        buyBtn.style.background = "#ff0055";
        buyBtn.style.color = "#fff";
      }
    }

    function nextItem() {
      const list = currentStoreType === 'guns' ? gunFiles : characterFiles;
      currentIndex = (currentIndex + 1) % list.length;
      updateStoreItem();
    }

    function prevItem() {
      const list = currentStoreType === 'guns' ? gunFiles : characterFiles;
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      updateStoreItem();
    }

    function buyOrEquip() {
      const list = currentStoreType === 'guns' ? gunFiles : characterFiles;
      const item = list[currentIndex];

      if (currentStoreType === 'guns') {
        if (userData.ownedGuns.includes(item)) {
          userData.equippedGun = item;
          alert("Gun Equipped!");
        } else if (userData.coins >= 200) {
          userData.coins -= 200;
          userData.ownedGuns.push(item);
          userData.equippedGun = item;
          updateDashboardUI();
          alert("Gun Bought & Equipped!");
        } else {
          alert("Not enough coins!");
        }
      } else {
        if (userData.ownedCharacters.includes(item)) {
          userData.equippedCharacter = item;
          alert("Character Equipped!");
        } else if (userData.coins >= 200) {
          userData.coins -= 200;
          userData.ownedCharacters.push(item);
          userData.equippedCharacter = item;
          updateDashboardUI();
          alert("Character Bought & Equipped!");
        } else {
          alert("Not enough coins!");
        }
      }
      updateStoreItem();
    }

    // Stage Screen BG Logic
    function openStage() {
      showScreen('stage-screen');
      changeBackground(document.getElementById('bg-selector').value);
    }

    function changeBackground(bgPath) {
      document.getElementById('stage-screen').style.backgroundImage = `url('${bgPath}')`;
    }
  </script>
</body>
</html>
