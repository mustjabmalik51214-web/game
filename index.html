<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STICKMAN FIGHT - Deluxe Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --primary-glow: #a855f7;
            --accent: #ff2a6d;
            --cyan: #05d9e8;
            --gold: #ffb703;
            --bg-dark: #0b0c10;
            --card-bg: rgba(30, 31, 48, 0.7);
            --border-glow: rgba(168, 85, 247, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1f1a3a 0%, #080711 100%);
        }

        /* Ambient Glow Background Effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-glow);
            filter: blur(150px);
            opacity: 0.15;
            top: 10%;
            left: 10%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--cyan);
            filter: blur(150px);
            opacity: 0.15;
            bottom: 10%;
            right: 10%;
            z-index: 0;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .active {
            display: flex;
        }

        /* Neon & Futuristic Buttons */
        button {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #7928ca, #ff0080);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(121, 40, 202, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 25px rgba(255, 0, 128, 0.6);
        }

        button:active {
            transform: translateY(1px) scale(0.97);
        }

        button:disabled {
            background: #333 !important;
            color: #777 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Header Title Styling */
        h1.game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 20%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Name Input Screen */
        #name-screen {
            background: rgba(11, 12, 16, 0.85);
        }

        #name-screen input {
            padding: 14px 24px;
            font-size: 18px;
            border-radius: 12px;
            border: 2px solid var(--primary-glow);
            outline: none;
            margin-bottom: 20px;
            text-align: center;
            background: rgba(20, 21, 33, 0.8);
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            transition: 0.3s;
        }

        #name-screen input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.4);
        }

        /* Creator Footer Link */
        .creator-link {
            position: absolute;
            bottom: 20px;
            color: #a855f7;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
            background: rgba(168, 85, 247, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .creator-link:hover {
            color: #fff;
            background: var(--primary-glow);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Top Coin Bar */
        .stats-bar {
            position: absolute;
            top: 25px;
            right: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btns {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 250px;
        }

        /* Store Screen Cards */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            height: 68vh;
            overflow-y: auto;
            padding: 15px;
            background: rgba(18, 19, 31, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .store-grid::-webkit-scrollbar {
            width: 8px;
        }

        .store-grid::-webkit-scrollbar-thumb {
            background: var(--primary-glow);
            border-radius: 10px;
        }

        .char-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-glow);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .char-card:hover {
            transform: translateY(-5px);
            border-color: var(--cyan);
            box-shadow: 0 10px 25px rgba(5, 217, 232, 0.2);
        }

        .char-card.owned {
            border-color: #2ed573;
            background: rgba(46, 213, 115, 0.08);
        }

        .char-preview {
            width: 80px;
            height: 90px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Modal Overlays */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #181926;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
            width: 320px;
            border: 1px solid var(--primary-glow);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
        }

        #iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #close-iframe {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 201;
            background: #ff4757;
            padding: 10px 20px;
        }

        /* Game Screen Arena */
        #game-screen {
            background: #05050d;
        }

        #game-canvas {
            background: linear-gradient(180deg, #101227 0%, #1a1c38 80%, #0d2818 100%);
            border-bottom: 6px solid #2ed573;
            box-shadow: 0 0 50px rgba(46, 213, 115, 0.2);
        }

        .game-ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 20;
        }

        .fighter-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .fighter-info span {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hp-container {
            width: 240px;
            background: rgba(0,0,0,0.6);
            height: 22px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            width: 100%;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 10px #ff4757;
        }

        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            box-sizing: border-box;
            z-index: 20;
        }

        .d-pad, .action-btns {
            display: flex;
            gap: 20px;
        }

        .ctrl-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: 0.1s;
        }

        .ctrl-btn:active {
            background: var(--primary-glow);
            transform: scale(0.92);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* Stages Screen */
        .stage-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            width: 85%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 20px;
            background: rgba(18, 19, 31, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
        }

        .stage-grid::-webkit-scrollbar {
            width: 8px;
        }

        .stage-grid::-webkit-scrollbar-thumb {
            background: var(--primary-glow);
            border-radius: 10px;
        }

        .stage-btn {
            padding: 12px 0;
            font-size: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2b2d42, #3d405b);
            box-shadow: none;
        }

        .stage-btn.locked {
            background: rgba(255,255,255,0.05) !important;
            color: #555 !important;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- Name Screen -->
    <div id="name-screen" class="screen">
        <h1 class="game-title">STICKMAN FIGHT</h1>
        <h2>WELCOME FIGHTER</h2>
        <br>
        <input type="text" id="username-input" placeholder="Enter Your Name...">
        <button onclick="saveName()">START GAME</button>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <div class="stats-bar">🪙 <span id="coin-display">0</span></div>
        <h1 class="game-title">STICKMAN FIGHT</h1>
        <div class="menu-btns">
            <button onclick="showScreen('stages-screen')">🎮 PLAY STAGES</button>
            <button onclick="showScreen('store-screen')">🛍️ CHARACTER STORE</button>
            <button onclick="showScreen('upgrade-screen')">⚡ UPGRADES</button>
        </div>
        <div class="creator-link" onclick="openCreatorLink()">created by muhammad taqi</div>
    </div>

    <!-- Store Screen -->
    <div id="store-screen" class="screen">
        <h2>CHARACTER STORE</h2>
        <div class="stats-bar">🪙 <span id="store-coin-display">0</span></div>
        <br>
        <div class="store-grid" id="store-grid"></div>
        <button onclick="showScreen('home-screen')">BACK TO MENU</button>
    </div>

    <!-- Buy Options Modal -->
    <div id="buy-modal" class="modal">
        <div class="modal-content">
            <h3>UNLOCK CHARACTER</h3>
            <p style="color: #aaa; font-size: 13px;">Choose unlock method:</p>
            <button onclick="handlePasswordBuy()">🔑 Write Password</button>
            <button onclick="handleIframeBuy()">🛒 Buy Now</button>
            <button onclick="closeModal()" style="background: #333; box-shadow: none;">Cancel</button>
        </div>
    </div>

    <!-- Fullscreen iFrame -->
    <div id="iframe-container">
        <button id="close-iframe" onclick="closeIframe()">✕ Close</button>
        <iframe src="https://muhammad-taqi512-lyra.hf.space" frameborder="0"></iframe>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-screen" class="screen">
        <h2>FIGHTER UPGRADES</h2>
        <div class="stats-bar">🪙 <span id="upgrade-coin-display">0</span></div>
        <br>
        <div style="background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--border-glow); display: flex; flex-direction: column; gap: 20px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div>
                <p style="font-weight: 600;">🥊 Damage: <span id="up-damage" style="color: var(--cyan); font-weight:700;">25</span> / 50</p>
                <br>
                <button onclick="upgradeDamage()" style="width: 100%;">+2 Damage (100 🪙)</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1);">
            <div>
                <p style="font-weight: 600;">❤️ Health (HP): <span id="up-hp" style="color: var(--accent); font-weight:700;">250</span> / 500</p>
                <br>
                <button onclick="upgradeHP()" style="width: 100%;">+10 HP (100 🪙)</button>
            </div>
        </div>
        <br>
        <button onclick="showScreen('home-screen')">BACK TO MENU</button>
    </div>

    <!-- Stages Screen -->
    <div id="stages-screen" class="screen">
        <h2>SELECT STAGE (1-100)</h2>
        <br>
        <div class="stage-grid" id="stage-grid"></div>
        <button onclick="showScreen('home-screen')">BACK TO MENU</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-ui">
            <div class="fighter-info">
                <span id="player-name-display" style="color: var(--cyan);">Player</span>
                <div class="hp-container"><div id="player-hp-bar" class="hp-bar"></div></div>
            </div>
            <h2 id="stage-display" style="font-family: 'Orbitron'; font-size: 24px; color: var(--gold);">Stage 1</h2>
            <div class="fighter-info" style="align-items: flex-end;">
                <span style="color: var(--accent);">Enemy Stickman</span>
                <div class="hp-container"><div id="enemy-hp-bar" class="hp-bar"></div></div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="controls">
            <div class="d-pad">
                <div class="ctrl-btn" id="btn-left">◀</div>
                <div class="ctrl-btn" id="btn-right">▶</div>
            </div>
            <div class="action-btns">
                <div class="ctrl-btn" id="btn-jump">▲</div>
                <div class="ctrl-btn" id="btn-punch" style="background: linear-gradient(135deg, #ff2a6d, #ff4757); border-color: #ff2a6d;">👊</div>
            </div>
        </div>
    </div>

  <script>
    // ================== CUSTOM STICKMAN THEMES ==================
    const STICKMAN_THEMES = [
        { body: '#05d9e8', glow: 'rgba(5, 217, 232, 0.6)', name: 'Neon Cyan' },
        { body: '#ff2a6d', glow: 'rgba(255, 42, 109, 0.6)', name: 'Neon Pink' },
        { body: '#ffb703', glow: 'rgba(255, 183, 3, 0.6)', name: 'Golden Sun' },
        { body: '#2ed573', glow: 'rgba(46, 213, 115, 0.6)', name: 'Emerald Green' },
        { body: '#a855f7', glow: 'rgba(168, 85, 247, 0.6)', name: 'Royal Purple' },
        { body: '#ff4757', glow: 'rgba(255, 71, 87, 0.6)', name: 'Crimson Red' },
        { body: '#1e90ff', glow: 'rgba(30, 144, 255, 0.6)', name: 'Electric Blue' },
        { body: '#ff7f50', glow: 'rgba(255, 127, 80, 0.6)', name: 'Coral Flame' },
        { body: '#00f5d4', glow: 'rgba(0, 245, 212, 0.6)', name: 'Aqua Mint' },
        { body: '#f72585', glow: 'rgba(247, 37, 133, 0.6)', name: 'Hot Magenta' },
    ];

    // Generate remaining unique color palettes up to 50
    for (let i = 10; i < 50; i++) {
        let hue = (i * 27) % 360;
        STICKMAN_THEMES.push({
            body: `hsl(${hue}, 100%, 60%)`,
            glow: `hsla(${hue}, 100%, 60%, 0.6)`,
            name: `Warrior #${i + 1}`
        });
    }

    // Data Structure
    let userData = {
        name: "",
        coins: 0,
        selectedChar: 0,
        ownedChars: [0],
        baseDamage: 25,
        baseHp: 250,
        unlockedStage: 1
    };

    let currentStage = 1;
    let selectedCharToBuy = null;

    // Auto Save & Load System
    function loadData() {
        const saved = localStorage.getItem('stickman_fight_save');
        if (saved) {
            userData = JSON.parse(saved);
            if (!userData.unlockedStage) userData.unlockedStage = 1;
            return true;
        }
        return false;
    }

    function saveData() {
        localStorage.setItem('stickman_fight_save', JSON.stringify(userData));
        updateCoinDisplays();
    }

    function updateCoinDisplays() {
        document.getElementById('coin-display').innerText = userData.coins;
        document.getElementById('store-coin-display').innerText = userData.coins;
        document.getElementById('upgrade-coin-display').innerText = userData.coins;
    }

    function openCreatorLink() {
        window.open('https://nexura.oneapp.dev/', '_blank');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if(id === 'store-screen') renderStore();
        if(id === 'stages-screen') renderStages();
        if(id === 'upgrade-screen') renderUpgrades();
        updateCoinDisplays();
    }

    // Initialize App
    window.onload = () => {
        if (loadData() && userData.name) {
            showScreen('home-screen');
        } else {
            showScreen('name-screen');
        }
    };

    function saveName() {
        const input = document.getElementById('username-input').value.trim();
        if (input) {
            userData.name = input;
            saveData();
            showScreen('home-screen');
        }
    }

    // Generate Characters Stats
    function getCharStats(index) {
        if(index === 0) return { price: 0, hp: userData.baseHp, damage: userData.baseDamage };
        
        let price = index * 500;
        let hp = 300 + (index - 1) * 100;
        let damage = 30 + (index - 1) * 10;
        return { price, hp, damage };
    }

    function renderStore() {
        const grid = document.getElementById('store-grid');
        grid.innerHTML = '';

        for (let i = 0; i < 50; i++) {
            const stats = getCharStats(i);
            const theme = STICKMAN_THEMES[i];
            const isOwned = userData.ownedChars.includes(i);
            const isSelected = userData.selectedChar === i;

            const card = document.createElement('div');
            card.className = `char-card ${isOwned ? 'owned' : ''}`;
            
            let btnHtml = '';
            if (isSelected) {
                btnHtml = `<button disabled style="background:#2ed573; box-shadow:0 0 10px #2ed573;">Equipped</button>`;
            } else if (isOwned) {
                btnHtml = `<button onclick="equipChar(${i})">Equip</button>`;
            } else if (i >= 29 && i <= 49) { 
                btnHtml = `<button onclick="openBuyModal(${i})">Buy Options</button>`;
            } else {
                btnHtml = `<button onclick="buyCharNormal(${i})">Buy (${stats.price} 🪙)</button>`;
            }

            // Create SVG Stickman Preview
            let previewSvg = `
                <svg width="60" height="70" viewBox="0 0 60 70">
                    <circle cx="30" cy="15" r="8" stroke="${theme.body}" stroke-width="3" fill="none" style="filter: drop-shadow(0 0 5px ${theme.glow});" />
                    <line x1="30" y1="23" x2="30" y2="45" stroke="${theme.body}" stroke-width="3" style="filter: drop-shadow(0 0 5px ${theme.glow});" />
                    <line x1="30" y1="30" x2="18" y2="42" stroke="${theme.body}" stroke-width="3" stroke-linecap="round" />
                    <line x1="30" y1="30" x2="42" y2="42" stroke="${theme.body}" stroke-width="3" stroke-linecap="round" />
                    <line x1="30" y1="45" x2="20" y2="62" stroke="${theme.body}" stroke-width="3" stroke-linecap="round" />
                    <line x1="30" y1="45" x2="40" y2="62" stroke="${theme.body}" stroke-width="3" stroke-linecap="round" />
                </svg>
            `;

            card.innerHTML = `
                <div class="char-preview">${previewSvg}</div>
                <h4 style="font-family:'Orbitron'; font-size:14px; color:${theme.body};">${theme.name}</h4>
                <p style="font-size:12px; color:#aaa;">HP: <b style="color:#fff;">${i === 0 ? userData.baseHp : stats.hp}</b> | DMG: <b style="color:#fff;">${i === 0 ? userData.baseDamage : stats.damage}</b></p>
                ${btnHtml}
            `;
            grid.appendChild(card);
        }
    }

    function equipChar(index) {
        userData.selectedChar = index;
        saveData();
        renderStore();
    }

    function buyCharNormal(index) {
        const stats = getCharStats(index);
        if (userData.coins >= stats.price) {
            userData.coins -= stats.price;
            userData.ownedChars.push(index);
            userData.selectedChar = index;
            saveData();
            renderStore();
        } else {
            alert("Not enough coins!");
        }
    }

    // Special Buy Options Modal
    function openBuyModal(index) {
        selectedCharToBuy = index;
        document.getElementById('buy-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('buy-modal').style.display = 'none';
    }

    function handlePasswordBuy() {
        closeModal();
        const charNum = selectedCharToBuy + 1;
        const targetPassword = `${userData.name}mt${userData.name.length}${charNum}`;
        
        const inputPass = prompt("Enter Unlock Password:");
        if (inputPass === targetPassword) {
            alert("Character Unlocked Successfully!");
            if (!userData.ownedChars.includes(selectedCharToBuy)) {
                userData.ownedChars.push(selectedCharToBuy);
            }
            userData.selectedChar = selectedCharToBuy;
            saveData();
            renderStore();
        } else {
            alert("Wrong Password!");
        }
    }

    function handleIframeBuy() {
        closeModal();
        document.getElementById('iframe-container').style.display = 'block';
        if (!userData.ownedChars.includes(selectedCharToBuy)) {
            userData.ownedChars.push(selectedCharToBuy);
        }
        userData.selectedChar = selectedCharToBuy;
        saveData();
        renderStore();
    }

    function closeIframe() {
        document.getElementById('iframe-container').style.display = 'none';
    }

    // Upgrades Logic
    function renderUpgrades() {
        document.getElementById('up-damage').innerText = userData.baseDamage;
        document.getElementById('up-hp').innerText = userData.baseHp;
    }

    function upgradeDamage() {
        if (userData.baseDamage >= 50) return alert("Max Damage Reached!");
        if (userData.coins >= 100) {
            userData.coins -= 100;
            userData.baseDamage = Math.min(50, userData.baseDamage + 2);
            saveData();
            renderUpgrades();
        } else alert("Not enough coins!");
    }

    function upgradeHP() {
        if (userData.baseHp >= 500) return alert("Max HP Reached!");
        if (userData.coins >= 100) {
            userData.coins -= 100;
            userData.baseHp = Math.min(500, userData.baseHp + 10);
            saveData();
            renderUpgrades();
        } else alert("Not enough coins!");
    }

    // Render Stages
    function renderStages() {
        const grid = document.getElementById('stage-grid');
        grid.innerHTML = '';
        for (let i = 1; i <= 100; i++) {
            const btn = document.createElement('button');
            btn.className = 'stage-btn';
            
            if (i <= userData.unlockedStage) {
                btn.innerText = i;
                btn.onclick = () => startStage(i);
            } else {
                btn.innerText = '🔒 ' + i;
                btn.className += ' locked';
                btn.disabled = true;
            }
            grid.appendChild(btn);
        }
    }

    // ================== HIGH-GRAPHICS GAME ENGINE ==================
    let canvas, ctx;
    let p1, enemy;
    let keys = {};
    let gameLoopId;
    let enemyAttackInterval;
    let particles = [];
    let backgroundStars = [];

    // New function: enemy HP per stage (increases by 50 each stage)
    function getEnemyMaxHp(stage) {
        return 200 + (stage - 1) * 50;
    }

    function startStage(stageNum) {
        currentStage = stageNum;
        showScreen('game-screen');
        
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.65;

        // Initialize background stars
        initBackground();

        // Player Setup
        let charStats = getCharStats(userData.selectedChar);
        let pMaxHp = userData.selectedChar === 0 ? userData.baseHp : charStats.hp;
        let pDmg = userData.selectedChar === 0 ? userData.baseDamage : charStats.damage;
        let pTheme = STICKMAN_THEMES[userData.selectedChar];

        p1 = {
            x: 120, y: canvas.height - 130, width: 40, height: 80,
            maxHp: pMaxHp, hp: pMaxHp, damage: pDmg,
            color: pTheme.body, glow: pTheme.glow,
            vx: 0, vy: 0, isJumping: false, isPunching: false
        };

        // Enemy Setup (Red Glow Stickman)
        let eMaxHp = getEnemyMaxHp(stageNum); // CHANGED: 50 HP per stage
        enemy = {
            x: canvas.width - 160, y: canvas.height - 130, width: 40, height: 80,
            maxHp: eMaxHp, hp: eMaxHp, damage: 10,
            color: '#ff4757', glow: 'rgba(255, 71, 87, 0.8)',
            isPunching: false
        };

        document.getElementById('player-name-display').innerText = userData.name;
        document.getElementById('stage-display').innerText = "Stage " + stageNum;
        updateHPBars();

        setupControls();

        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        if (enemyAttackInterval) clearInterval(enemyAttackInterval);

        // Enemy AI Attack Interval (0.7 sec)
        enemyAttackInterval = setInterval(enemyAI, 700);

        gameLoop();
    }

    function initBackground() {
        backgroundStars = [];
        for (let i = 0; i < 100; i++) {
            backgroundStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height * 0.6),
                radius: Math.random() * 1.5 + 0.5,
                baseAlpha: Math.random() * 0.5 + 0.3,
                speed: Math.random() * 0.02 + 0.01
            });
        }
    }

    function drawBackground(stageNum) {
        // Sky gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#0b0c2a');
        gradient.addColorStop(0.5, '#1a1c3a');
        gradient.addColorStop(1, '#2a1a3a');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Stars with twinkle
        const time = Date.now() * 0.001;
        backgroundStars.forEach(star => {
            const alpha = star.baseAlpha + Math.sin(time * star.speed * 10) * 0.2;
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, alpha))})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // Moon
        ctx.fillStyle = 'rgba(255, 255, 200, 0.9)';
        ctx.shadowColor = 'rgba(255, 255, 200, 0.5)';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Mountains silhouette
        ctx.fillStyle = '#101025';
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 80);
        ctx.lineTo(canvas.width * 0.2, canvas.height - 180);
        ctx.lineTo(canvas.width * 0.35, canvas.height - 100);
        ctx.lineTo(canvas.width * 0.5, canvas.height - 220);
        ctx.lineTo(canvas.width * 0.65, canvas.height - 90);
        ctx.lineTo(canvas.width * 0.8, canvas.height - 150);
        ctx.lineTo(canvas.width, canvas.height - 70);
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();
        ctx.fill();
        
        // Floor with grid
        const floorY = canvas.height - 50;
        const floorGradient = ctx.createLinearGradient(0, floorY, 0, canvas.height);
        floorGradient.addColorStop(0, 'rgba(46, 213, 115, 0.15)');
        floorGradient.addColorStop(1, 'rgba(46, 213, 115, 0.3)');
        ctx.fillStyle = floorGradient;
        ctx.fillRect(0, floorY, canvas.width, 50);
        
        // Grid lines
        ctx.strokeStyle = 'rgba(46, 213, 115, 0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.moveTo(i, floorY);
            ctx.lineTo(i, canvas.height);
        }
        for (let j = 0; j < 50; j += 10) {
            ctx.moveTo(0, floorY + j);
            ctx.lineTo(canvas.width, floorY + j);
        }
        ctx.stroke();
    }

    function createHitParticles(x, y, color) {
        for(let i=0; i<12; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                radius: Math.random() * 4 + 2,
                color: color,
                alpha: 1
            });
        }
    }

    function enemyAI() {
        if (!enemy || enemy.hp <= 0) return;
        
        if (enemy.x - (p1.x + p1.width) > 30) {
            enemy.x -= 15;
        } else if (p1.x - (enemy.x + enemy.width) > 30) {
            enemy.x += 15;
        }

        enemy.isPunching = true;
        
        let distance = Math.abs((p1.x + p1.width / 2) - (enemy.x + enemy.width / 2));
        if (distance < 50) { 
            p1.hp -= enemy.damage;
            if (p1.hp < 0) p1.hp = 0;
            createHitParticles(p1.x + 20, p1.y + 30, enemy.color);
            updateHPBars();
            if (p1.hp <= 0) endGame(false);
        }

        setTimeout(() => { if(enemy) enemy.isPunching = false; }, 200);
    }

    function playerPunch() {
        if (p1.isPunching) return;
        p1.isPunching = true;

        let distance = Math.abs((p1.x + p1.width / 2) - (enemy.x + enemy.width / 2));
        if (distance < 50) { 
            enemy.hp -= p1.damage;
            if (enemy.hp < 0) enemy.hp = 0;
            createHitParticles(enemy.x + 20, enemy.y + 30, p1.color);
            updateHPBars();
            if (enemy.hp <= 0) endGame(true);
        }

        setTimeout(() => { p1.isPunching = false; }, 200);
    }

    function setupControls() {
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            el.ontouchstart = el.onmousedown = (e) => { e.preventDefault(); keys[key] = true; if(key==='punch') playerPunch(); };
            el.ontouchend = el.onmouseup = (e) => { e.preventDefault(); keys[key] = false; };
        };

        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');
        bindBtn('btn-jump', 'jump');
        bindBtn('btn-punch', 'punch');
    }

    function updateHPBars() {
        document.getElementById('player-hp-bar').style.width = (p1.hp / p1.maxHp * 100) + '%';
        document.getElementById('enemy-hp-bar').style.width = (enemy.hp / enemy.maxHp * 100) + '%';
    }

    function gameLoop() {
        if (keys['left'] && p1.x > 0) p1.x -= 6;
        if (keys['right'] && p1.x < canvas.width - p1.width) p1.x += 6;
        if (keys['jump'] && !p1.isJumping) {
            p1.vy = -13;
            p1.isJumping = true;
        }

        p1.y += p1.vy;
        p1.vy += 0.65;
        if (p1.y >= canvas.height - 130) {
            p1.y = canvas.height - 130;
            p1.vy = 0;
            p1.isJumping = false;
        }

        // Draw beautiful background instead of just clearing
        drawBackground(currentStage);

        // Update & Render Particles
        particles.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.04;
            if(p.alpha <= 0) particles.splice(idx, 1);

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // Draw Cute Stylized Stickmen
        drawGlowStickman(p1, false);
        drawGlowStickman(enemy, true);

        if (p1.hp > 0 && enemy.hp > 0) {
            gameLoopId = requestAnimationFrame(gameLoop);
        }
    }

    function drawGlowStickman(char, isEnemy) {
        ctx.save();
        
        const centerX = char.x + 20;
        const baseY = char.y;
        const themeColor = char.color;
        const glowColor = char.glow;
        
        // Shadow/glow
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 15;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Draw body with bezier curves for cuteness
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 4;
        
        // Head
        ctx.beginPath();
        ctx.arc(centerX, baseY + 18, 16, 0, Math.PI * 2);
        ctx.stroke();
        
        // Face - cute features
        // Eyes
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowBlur = 0; // no glow for eyes
        ctx.beginPath();
        ctx.arc(centerX - 6, baseY + 16, 3.5, 0, Math.PI * 2);
        ctx.arc(centerX + 6, baseY + 16, 3.5, 0, Math.PI * 2);
        ctx.fill();
        
        // Pupils
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(centerX - 6, baseY + 16, 1.8, 0, Math.PI * 2);
        ctx.arc(centerX + 6, baseY + 16, 1.8, 0, Math.PI * 2);
        ctx.fill();
        
        // Blush
        ctx.fillStyle = 'rgba(255, 150, 150, 0.7)';
        ctx.beginPath();
        ctx.arc(centerX - 10, baseY + 22, 3, 0, Math.PI * 2);
        ctx.arc(centerX + 10, baseY + 22, 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Smile
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, baseY + 18, 6, 0.2 * Math.PI, 0.8 * Math.PI); // smile
        ctx.stroke();
        
        // Restore glow
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 15;
        ctx.lineWidth = 4;
        
        // Body
        ctx.beginPath();
        ctx.moveTo(centerX, baseY + 34);
        ctx.quadraticCurveTo(centerX + 5, baseY + 50, centerX, baseY + 65); // slight curve
        ctx.stroke();
        
        // Legs - bouncy curves
        ctx.beginPath();
        ctx.moveTo(centerX, baseY + 65);
        ctx.quadraticCurveTo(centerX - 15, baseY + 80, centerX - 18, baseY + 95);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(centerX, baseY + 65);
        ctx.quadraticCurveTo(centerX + 15, baseY + 80, centerX + 18, baseY + 95);
        ctx.stroke();
        
        // Arms
        if (char.isPunching) {
            let punchDir = isEnemy ? -35 : 35;
            ctx.beginPath();
            ctx.moveTo(centerX, baseY + 42);
            ctx.quadraticCurveTo(centerX + punchDir * 0.5, baseY + 35, centerX + punchDir, baseY + 42);
            ctx.stroke();
            // Add impact effect
            ctx.fillStyle = themeColor;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(centerX + punchDir, baseY + 42, 5, 0, Math.PI*2);
            ctx.fill();
        } else {
            // Left arm
            ctx.beginPath();
            ctx.moveTo(centerX, baseY + 42);
            ctx.quadraticCurveTo(centerX - 15, baseY + 50, centerX - 12, baseY + 60);
            ctx.stroke();
            // Right arm
            ctx.beginPath();
            ctx.moveTo(centerX, baseY + 42);
            ctx.quadraticCurveTo(centerX + 15, baseY + 50, centerX + 12, baseY + 60);
            ctx.stroke();
        }
        
        ctx.restore();
    }

    function endGame(won) {
        clearInterval(enemyAttackInterval);
        cancelAnimationFrame(gameLoopId);

        let prize = 0;

        if (won) {
            if (currentStage === userData.unlockedStage) {
                prize = 500;
                if (userData.unlockedStage < 100) {
                    userData.unlockedStage += 1;
                }
            } else {
                prize = 100;
            }
        } else {
            prize = 100;
        }

        userData.coins += prize;
        saveData();

        setTimeout(() => {
            let msg = "";
            if (won) {
                if (prize === 500) {
                    msg = `🏆 VICTORY! First Time Clear! You earned ${prize} Coins!`;
                } else {
                    msg = `🏆 VICTORY! Stage Replay Reward: ${prize} Coins!`;
                }
            } else {
                msg = `💀 DEFEAT! You earned ${prize} Coins.`;
            }
            alert(msg);
            showScreen('home-screen');
        }, 150);
    }
</script>
