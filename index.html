<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TINNY FISHING</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #004a73 0%, #002b45 45%, #00121f 100%);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Bubbles ---------- */
  #bubbles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  #bubbles span {
    position: absolute;
    bottom: -80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
                rgba(255,255,255,.85),
                rgba(120,230,255,.25) 45%,
                rgba(255,255,255,.03) 72%);
    border: 1px solid rgba(255,255,255,.18);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(.8); opacity: 0; }
    12%  { opacity: .85; }
    88%  { opacity: .85; }
    100% { transform: translateY(-115vh) translateX(50px) scale(1.15); opacity: 0; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 30px 24px;
    animation: cardIn .9s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(35px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- Circle Icon ---------- */
  .logo-wrap {
    position: relative;
    width: 170px;
    height: 170px;
    margin: 0 auto 28px;
    border-radius: 50%;
    overflow: hidden;
    background: #012b45;
    border: 5px solid rgba(255,255,255,.9);
    box-shadow:
      0 0 0 9px rgba(0, 220, 255, .14),
      0 0 45px rgba(0, 210, 255, .75),
      0 0 90px rgba(0, 150, 255, .35);
    animation: floaty 3.2s ease-in-out infinite,
               glowPulse 2.6s ease-in-out infinite alternate;
  }
  .logo-wrap .fish-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    z-index: 0;
  }
  .logo-wrap img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }
  @keyframes glowPulse {
    from { box-shadow: 0 0 0 9px rgba(0,220,255,.10), 0 0 35px rgba(0,210,255,.55), 0 0 70px rgba(0,150,255,.25); }
    to   { box-shadow: 0 0 0 12px rgba(0,220,255,.20), 0 0 60px rgba(0,230,255,.95), 0 0 110px rgba(0,150,255,.5); }
  }

  /* ---------- Title ---------- */
  .title {
    font-size: clamp(2.1rem, 9vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 6px;
    line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 0%, #9bf3ff 55%, #00c2ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(0, 200, 255, .65));
  }

  .credit {
    margin-top: 12px;
    font-size: clamp(.72rem, 3vw, .9rem);
    font-weight: 600;
    letter-spacing: 4px;
    color: #8fd8f2;
    text-transform: uppercase;
    opacity: .9;
  }
  .credit b {
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 3px;
  }

  /* ---------- Play Button ---------- */
  .play-btn {
    margin-top: 42px;
    padding: 18px 64px;
    font-family: inherit;
    font-size: clamp(1.1rem, 4.5vw, 1.45rem);
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #00303f;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    background: linear-gradient(180deg, #b6fff2 0%, #2df0d2 45%, #00bfa6 100%);
    box-shadow:
      0 9px 0 #00796b,
      0 14px 35px rgba(0, 235, 200, .45);
    transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
    animation: btnPulse 2.2s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 9px 0 #00796b, 0 14px 35px rgba(0,235,200,.40); }
    50%      { box-shadow: 0 9px 0 #00796b, 0 14px 55px rgba(0,255,215,.80); }
  }
  .play-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.08);
    box-shadow: 0 12px 0 #00796b, 0 20px 45px rgba(0,255,215,.65);
  }
  .play-btn:active {
    transform: translateY(6px);
    box-shadow: 0 3px 0 #00796b, 0 8px 18px rgba(0,255,215,.40);
    animation: none;
  }

  /* ---------- Bottom wave glow ---------- */
  .wave-glow {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 180px;
    background: radial-gradient(ellipse at 50% 130%,
                rgba(0, 200, 255, .35) 0%,
                rgba(0, 140, 200, .12) 45%,
                transparent 70%);
    pointer-events: none;
    z-index: 2;
  }

  @media (max-width: 420px) {
    .logo-wrap { width: 135px; height: 135px; }
    .play-btn  { padding: 16px 48px; }
  }
</style>
</head>
<body>

  <div id="bubbles"></div>

  <div class="card">
    <div class="logo-wrap">
      <span class="fish-fallback">🐟</span>
      <img src="icon.png" alt="TINNY FISH Logo">
    </div>

    <h1 class="title">TINNY FISHING</h1>
    <p class="credit">Created by <b>Muhammad Taqi</b></p>

    <button class="play-btn" onclick="startGame()">Play Game</button>
  </div>

  <div class="wave-glow"></div>

<script>
  /* Bubbles */
  (function makeBubbles() {
    const box = document.getElementById('bubbles');
    const total = window.innerWidth < 500 ? 12 : 20;

    for (let i = 0; i < total; i++) {
      const b = document.createElement('span');
      const size = Math.random() * 32 + 8;
      b.style.width  = size + 'px';
      b.style.height = size + 'px';
      b.style.left   = Math.random() * 100 + '%';
      b.style.animationDuration = (Math.random() * 9 + 6) + 's';
      b.style.animationDelay    = (Math.random() * 10) + 's';
      box.appendChild(b);
    }
  })();

  /* Play Game -> 1.html */
  function startGame() {
    window.location.href = '1.html';
  }
</script>

</body>
</html>
