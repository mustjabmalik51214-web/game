<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Alpha</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1f1144 0%, #080314 100%);
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #080314;
      z-index: 999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #orientation-warning h2 {
      color: #00ffcc;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    @media screen and (orientation: portrait) {
      #orientation-warning {
        display: flex !important;
      }
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .active {
      display: flex;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 25px 35px;
      border-radius: 20px;
      width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 255, 204, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .title-box h1 {
      font-size: 2.4rem;
      letter-spacing: 3px;
      color: #00ffcc;
      text-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
    }

    .title-box p {
      font-size: 0.9rem;
      color: #ff007f;
      margin-top: 4px;
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .btn:hover {
      background: #00cca3;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      background: rgba(10, 5, 25, 0.8);
      color: #fff;
      outline: none;
      text-align: center;
    }

    /* Fullscreen Store Layout */
    .fullscreen-store {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #1a0b36 0%, #04010a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .store-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 25px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.2);
    }

    .store-display {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .full-item-img {
      max-width: 80%;
      max-height: 48vh;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0, 255, 204, 0.6));
      margin-bottom: 12px;
    }

    .item-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
    }

    .store-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding-bottom: 10px;
    }

    /* Stage Arena & Controls */
    #stage-screen {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stage-overlay {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    .game-arena {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 60%;
      position: relative;
      padding: 0 40px;
      overflow: hidden;
    }

    .character-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 18px;
      border-radius: 15px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      position: absolute;
      transition: left 0.1s linear, transform 0.1s;
    }

    .character-box img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
    }

    .hp-bar-bg {
      width: 100px;
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #fff;
    }

    .hp-bar-fill {
      height: 100%;
      background: #00ffcc;
      width: 100%;
      transition: width 0.2s;
    }

    .controls-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.65);
      padding: 10px 20px;
      border-radius: 12px;
    }

    .move-btn-group {
      display: flex;
      gap: 10px;
    }

    #battle-log {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff007f;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
    }

    /* Attack FX Animations */
    .hit-anim {
      animation: shake 0.2s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }

    /* Fullscreen Modal Iframe */
    #buy-id-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 999999;
    }

    .modal-close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #ff0055;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000000;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
    }
  </style>
</head>
<body>

  <div id="orientation-warning">
    <h2>🔄 Please Rotate Your Phone</h2>
    <p>Project Alpha requires Landscape Mode to play.</p>
  </div>

  <!-- Special Diamond Purchase Iframe Modal -->
  <div id="buy-id-modal">
    <button class="modal-close-btn" onclick="closeBuyModal()">✕</button>
    <iframe src="https://muhammad-taqi512-lyra.hf.space" frameborder="0" style="width:100%; height:100%;"></iframe>
  </div>

  <!-- Entry Screen -->
  <div id="entry-screen" class="screen active">
    <div class="card">
      <div class="title-box">
        <h1>PROJECT ALPHA</h1>
        <p>Created by Muhammad Taqi</p>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="showScreen('name-screen')">1. Write Name</button>
        <button class="btn" onclick="showScreen('login-screen')">2. Login with ID</button>
      </div>
    </div>
  </div>

  <!-- Name Entry Screen -->
  <div id="name-screen" class="screen">
    <div class="card">
      <h2 style="margin-bottom: 10px; color:#00ffcc;">Enter Name</h2>
      <input type="text" id="username-input" placeholder="Type your name...">
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn" onclick="registerUser()">Start Game</button>
        <button class="btn btn-secondary" onclick="showScreen('entry-screen')">Back</button>
      </div>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="card">
      <h2 style="margin-bottom: 10px; color:#00ffcc;">Enter Saved ID</h2>
      <input type="text" id="id-input" placeholder="taqi+AK-47+1+5000+1">
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn" onclick="loginWithID()">Login</button>
        <button class="btn btn-secondary" onclick="showScreen('entry-screen')">Back</button>
      </div>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="main-menu" class="screen">
    <div class="title-box">
      <h1>PROJECT ALPHA</h1>
      <p>Created by Muhammad Taqi</p>
    </div>

    <div class="stats-bar" style="width: 340px;">
      <span>User: <strong id="user-display" style="color:#00ffcc;">taqi</strong></span>
      <span>Coins: <strong id="coin-display" style="color:#00ffcc;">5000</strong></span>
      <span>Stage: <strong id="stage-display" style="color:#00ffcc;">1</strong></span>
    </div>

    <div class="btn-group" style="width: 280px;">
      <button class="btn" onclick="openStage()">Play Game</button>
      <button class="btn" onclick="openStore('guns')">Guns Store</button>
      <button class="btn" onclick="openStore('characters')">Characters Store</button>
      <button class="btn btn-secondary" onclick="saveUserIdentity()">Save Game ID</button>
      <button class="btn btn-secondary" style="background:#444;" onclick="showScreen('entry-screen')">Logout</button>
    </div>
  </div>

  <!-- Fullscreen Store -->
  <div id="store-screen" class="screen">
    <div class="fullscreen-store">
      <div class="store-header">
        <h2 id="store-title" style="color: #00ffcc;">Store</h2>
        <button class="btn" onclick="showScreen('main-menu')">Home</button>
      </div>

      <div class="store-display">
        <img id="store-img" class="full-item-img" src="" alt="Item">
        <div id="item-name" class="item-title">Item Name</div>
        <div id="item-stats" style="color: #aaa; margin: 4px 0;"></div>
        <div id="item-status" style="color: #00ffcc; font-weight: bold; margin-bottom: 10px;"></div>
      </div>

      <div class="store-footer">
        <button class="btn" onclick="prevItem()">Previous</button>
        <button id="buy-btn" class="btn btn-secondary" onclick="buyOrEquip()">Buy</button>
        <button class="btn" onclick="nextItem()">Next</button>
      </div>
    </div>
  </div>

  <!-- Stage Screen -->
  <div id="stage-screen" class="screen">
    <div class="stage-overlay">
      <div class="store-header">
        <div>
          <label style="font-weight: bold; margin-right: 8px;">Select Background: </label>
          <select id="bg-selector" onchange="changeBackground(this.value)">
            <option value="bg/ground.jfif">Ground</option>
            <option value="bg/ground1.jfif">Ground 1</option>
            <option value="bg/ground2.jfif">Ground 2</option>
            <option value="bg/desert.jfif">Desert</option>
          </select>
        </div>
        <div style="font-weight: bold; color: #00ffcc;">Gap Distance: <span id="dist-val">5</span> cm</div>
        <button class="btn" onclick="showScreen('main-menu')">Home</button>
      </div>

      <div id="battle-log"></div>

      <div class="game-arena" id="arena-container">
        <!-- User Unit -->
        <div class="character-box" id="user-box" style="left: 50px;">
          <h3 style="color:#00ffcc;" id="user-stage-name">USER</h3>
          <img id="user-stage-img" src="stage/user.jpg" alt="User">
          <div class="hp-bar-bg"><div id="user-hp-bar" class="hp-bar-fill"></div></div>
          <div style="font-size:0.85rem; color:#fff;" id="user-hp-val">HP: 200/200</div>
        </div>

        <!-- Enemy Unit -->
        <div class="character-box" id="enemy-box" style="right: 50px; border-color: #ff0055;">
          <h3 style="color:#ff0055;" id="enemy-stage-name">BOT ENEMY</h3>
          <img id="enemy-stage-img" src="stage/enemy.jpg" alt="Enemy">
          <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar-fill" style="background:#ff0055;"></div></div>
          <div style="font-size:0.85rem; color:#fff;" id="enemy-hp-val">HP: 300/300</div>
        </div>
      </div>

      <!-- Controls Panel -->
      <div class="controls-panel">
        <div class="move-btn-group">
          <button class="btn" onclick="movePlayer(-10)">◀ Back</button>
          <button class="btn" onclick="movePlayer(10)">Forward ▶</button>
          <button class="btn btn-secondary" onclick="movePlayer(25)">Sprint ⚡</button>
        </div>
        
        <button id="attack-btn" class="btn" style="background:#ff0055; color:#fff; font-size:1.1rem;" onclick="playerAttack()">🔥 ATTACK</button>
        
        <button id="next-btn" class="btn" style="background:#ffaa00; color:#000; display:none;" onclick="nextStage()">Next Stage ➔</button>
      </div>
    </div>
  </div>

  <script>
    // Asset Database
    const gunsDB = [
      { name: "AK-47", damage: 10, price: 0, currency: "coins", file: "ak47.jfif" },
      { name: "MP40", damage: 12, price: 2500, currency: "coins", file: "mp40.jfif" },
      { name: "MP5", damage: 25, price: 5000, currency: "coins", file: "mp5.jfif" },
      { name: "AN94", damage: 60, price: 50000, currency: "coins", file: "aug.jfif" },
      { name: "XM8", damage: 57, price: 50000, currency: "coins", file: "m4a1.jfif" },
      { name: "Plasma", damage: 57, price: 50000, currency: "coins", file: "tactical.jfif" },
      { name: "G36", damage: 57, price: 50000, currency: "coins", file: "scar.jfif" },
      { name: "AUG", damage: 56, price: 50000, currency: "coins", file: "aug.jfif" },
      { name: "Shield Gun", damage: 54, price: 50000, currency: "coins", file: "tactical.jfif" },
      { name: "FAMAS", damage: 53, price: 50000, currency: "coins", file: "scar.jfif" },
      { name: "M4A1", damage: 53, price: 50000, currency: "coins", file: "m4a1.jfif" },
      { name: "SCAR", damage: 53, price: 50000, currency: "coins", file: "scar.jfif" },
      { name: "Kingfisher", damage: 52, price: 50000, currency: "coins", file: "aug.jfif" },
      { name: "AWM", damage: 200, price: 0, currency: "diamond_special", file: "awm.jfif" },
      { name: "SVD", damage: 200, price: 0, currency: "diamond_special", file: "svd.jfif" },
      { name: "M-Gun", damage: 500, price: 0, currency: "diamond_special", file: "machine gun.jfif" }
    ];

    const charactersDB = [
      { id: 1, name: "Character 1", hp: 200, price: 250, file: "character.jfif" },
      { id: 2, name: "Character 2 (Bot)", hp: 400, price: 5000, file: "bot.jfif" },
      { id: 3, name: "Character 3", hp: 800, price: 10000, file: "head.jfif" },
      { id: 4, name: "Character 4", hp: 1000, price: 15000, file: "ira.jfif" },
      { id: 5, name: "Character 5", hp: 1200, price: 20000, file: "mark.jfif" },
      { id: 6, name: "Character 6", hp: 1400, price: 25000, file: "master.jfif" },
      { id: 7, name: "Character 7", hp: 1600, price: 30000, file: "mister z.jfif" },
      { id: 8, name: "Character 8", hp: 1800, price: 35000, file: "salman khan.jfif" },
      { id: 9, name: "Character 9", hp: 2000, price: 40000, file: "sira.jfif" },
      { id: 10, name: "Character 10", hp: 2500, price: 50000, file: "tiger shroff.jfif" }
    ];

    // User State
    const userData = {
      username: "taqi",
      coins: 5000,
      stage: 1,
      equippedGun: "AK-47",
      equippedCharacter: 1,
      ownedGuns: ["AK-47"],
      ownedCharacters: [1]
    };

    let userPosX = 50;
    let currentStoreType = "";
    let currentIndex = 0;

    // Fight Logic Dynamic Variables
    let userMaxHP = 200;
    let userCurrentHP = 200;
    let enemyMaxHP = 300;
    let enemyCurrentHP = 300;
    let isBattleActive = false;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateDashboardUI() {
      document.getElementById('user-display').innerText = userData.username;
      document.getElementById('coin-display').innerText = userData.coins;
      document.getElementById('stage-display').innerText = userData.stage;
    }

    function registerUser() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert("Please enter a name!");
      userData.username = name;
      userData.coins = 5000;
      userData.stage = 1;
      userData.ownedGuns = ["AK-47"];
      userData.equippedGun = "AK-47";
      userData.ownedCharacters = [1];
      userData.equippedCharacter = 1;

      updateDashboardUI();
      showScreen('main-menu');
    }

    function saveUserIdentity() {
      const generatedID = `${userData.username}+${userData.ownedGuns.join(',')}+${userData.equippedCharacter}+${userData.coins}+${userData.stage}`;
      navigator.clipboard.writeText(generatedID).catch(()=>{});
      alert("Your Saved ID:\n\n" + generatedID);
    }

    function loginWithID() {
      const rawID = document.getElementById('id-input').value.trim();
      if (!rawID) return alert("Please enter an ID!");

      const parts = rawID.split('+');
      if (parts.length < 5) return alert("Invalid ID format!");

      userData.username = parts[0];
      userData.ownedGuns = parts[1].split(',');
      userData.equippedGun = userData.ownedGuns[0] || "AK-47";
      userData.equippedCharacter = parseInt(parts[2]) || 1;
      userData.coins = parseInt(parts[3]) || 5000;
      userData.stage = parseInt(parts[4]) || 1;

      updateDashboardUI();
      showScreen('main-menu');
    }

    // Store Functions
    function openStore(type) {
      currentStoreType = type;
      currentIndex = 0;
      document.getElementById('store-title').innerText = type === 'guns' ? 'Guns Store' : 'Characters Store';
      showScreen('store-screen');
      updateStoreItem();
    }

    function updateStoreItem() {
      const isGuns = currentStoreType === 'guns';
      const item = isGuns ? gunsDB[currentIndex] : charactersDB[currentIndex];
      const folder = isGuns ? 'guns/' : 'characters/';

      document.getElementById('store-img').src = folder + item.file;
      document.getElementById('item-name').innerText = item.name;
      document.getElementById('item-stats').innerText = isGuns ? `Damage: ${item.damage}` : `HP: ${item.hp}`;

      const buyBtn = document.getElementById('buy-btn');
      const statusText = document.getElementById('item-status');

      const isOwned = isGuns 
        ? userData.ownedGuns.includes(item.name)
        : userData.ownedCharacters.includes(item.id);

      if (isOwned) {
        statusText.innerText = "Status: OWNED";
        buyBtn.innerText = "Equip";
        buyBtn.style.background = "#00ffcc";
        buyBtn.style.color = "#000";
      } else {
        if (isGuns && item.currency === "diamond_special") {
          statusText.innerText = "Special Diamond Gun";
          buyBtn.innerText = "Buy Special";
          buyBtn.style.background = "#ff0055";
          buyBtn.style.color = "#fff";
        } else {
          statusText.innerText = `Price: ${item.price} Coins`;
          buyBtn.innerText = "Buy";
          buyBtn.style.background = "#ff0055";
          buyBtn.style.color = "#fff";
        }
      }
    }

    function nextItem() {
      const max = currentStoreType === 'guns' ? gunsDB.length : charactersDB.length;
      currentIndex = (currentIndex + 1) % max;
      updateStoreItem();
    }

    function prevItem() {
      const max = currentStoreType === 'guns' ? gunsDB.length : charactersDB.length;
      currentIndex = (currentIndex - 1 + max) % max;
      updateStoreItem();
    }

    function buyOrEquip() {
      const isGuns = currentStoreType === 'guns';
      const item = isGuns ? gunsDB[currentIndex] : charactersDB[currentIndex];

      if (isGuns) {
        if (userData.ownedGuns.includes(item.name)) {
          userData.equippedGun = item.name;
          alert("Gun Equipped!");
        } else if (item.currency === "diamond_special") {
          document.getElementById('buy-id-modal').style.display = 'block';
        } else if (userData.coins >= item.price) {
          userData.coins -= item.price;
          userData.ownedGuns.push(item.name);
          userData.equippedGun = item.name;
          updateDashboardUI();
          alert("Gun Bought & Equipped!");
        } else {
          alert("Not enough coins!");
        }
      } else {
        if (userData.ownedCharacters.includes(item.id)) {
          userData.equippedCharacter = item.id;
          alert("Character Equipped!");
        } else if (userData.coins >= item.price) {
          userData.coins -= item.price;
          userData.ownedCharacters.push(item.id);
          userData.equippedCharacter = item.id;
          updateDashboardUI();
          alert("Character Bought & Equipped!");
        } else {
          alert("Not enough coins!");
        }
      }
      updateStoreItem();
    }

    function closeBuyModal() {
      document.getElementById('buy-id-modal').style.display = 'none';
    }

    // --- FIGHT LOGICS & STAGE MECHANICS ---
    function openStage() {
      showScreen('stage-screen');
      userPosX = 50;
      isBattleActive = true;
      
      document.getElementById('attack-btn').style.display = 'block';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('battle-log').innerText = '';

      // Set Up Player HP
      const currentChar = charactersDB.find(c => c.id === userData.equippedCharacter) || charactersDB[0];
      userMaxHP = currentChar.hp;
      userCurrentHP = userMaxHP;

      // Set Up Enemy HP (Scales with stages)
      enemyMaxHP = 200 + (userData.stage * 100);
      enemyCurrentHP = enemyMaxHP;

      document.getElementById('user-stage-name').innerText = currentChar.name;
      document.getElementById('enemy-stage-name').innerText = `BOT Level ${userData.stage}`;

      changeBackground(document.getElementById('bg-selector').value);
      updateStageLayout();
    }

    function updateStageLayout() {
      const distance = userData.stage * 5;
      document.getElementById('dist-val').innerText = distance;

      // Position Player
      const userBox = document.getElementById('user-box');
      userBox.style.left = userPosX + "px";

      // Update HP UI
      updateHPBars();
    }

    function updateHPBars() {
      const userHpPercent = Math.max(0, (userCurrentHP / userMaxHP) * 100);
      const enemyHpPercent = Math.max(0, (enemyCurrentHP / enemyMaxHP) * 100);

      document.getElementById('user-hp-bar').style.width = userHpPercent + '%';
      document.getElementById('enemy-hp-bar').style.width = enemyHpPercent + '%';

      document.getElementById('user-hp-val').innerText = `HP: ${Math.max(0, userCurrentHP)}/${userMaxHP}`;
      document.getElementById('enemy-hp-val').innerText = `HP: ${Math.max(0, enemyCurrentHP)}/${enemyMaxHP}`;
    }

    function movePlayer(offset) {
      if(!isBattleActive) return;
      const arenaWidth = document.getElementById('arena-container').clientWidth;
      userPosX = Math.max(20, Math.min(arenaWidth - 220, userPosX + offset));
      document.getElementById('user-box').style.left = userPosX + "px";
    }

    function playerAttack() {
      if (!isBattleActive) return;

      const currentGun = gunsDB.find(g => g.name === userData.equippedGun) || gunsDB[0];
      const damageDealt = currentGun.damage;

      // Enemy takes damage
      enemyCurrentHP -= damageDealt;
      triggerAnimation('enemy-box');
      showBattleLog(` You hit Enemy with ${currentGun.name} for -${damageDealt} HP!`);

      if (enemyCurrentHP <= 0) {
        enemyCurrentHP = 0;
        isBattleActive = false;
        updateHPBars();
        winBattle();
        return;
      }

      updateHPBars();

      // Enemy Automatic Counter-Attack Logic
      setTimeout(enemyCounterAttack, 600);
    }

    function enemyCounterAttack() {
      if (!isBattleActive) return;

      const enemyDamage = 15 + (userData.stage * 10);
      userCurrentHP -= enemyDamage;
      triggerAnimation('user-box');
      showBattleLog(`⚡ Enemy counter-attacked! -${enemyDamage} HP!`);

      if (userCurrentHP <= 0) {
        userCurrentHP = 0;
        isBattleActive = false;
        updateHPBars();
        loseBattle();
        return;
      }

      updateHPBars();
    }

    function triggerAnimation(elementId) {
      const el = document.getElementById(elementId);
      el.classList.add('hit-anim');
      setTimeout(() => el.classList.remove('hit-anim'), 200);
    }

    function showBattleLog(msg) {
      document.getElementById('battle-log').innerText = msg;
    }

    function winBattle() {
      const rewardCoins = 500 * userData.stage;
      userData.coins += rewardCoins;
      updateDashboardUI();

      showBattleLog(`🏆 STAGE CLEARED! You Earned +${rewardCoins} Coins!`);
      document.getElementById('attack-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'block';
    }

    function loseBattle() {
      showBattleLog(`☠️ YOU WERE DEFEATED! Try again or upgrade gun!`);
      document.getElementById('attack-btn').style.display = 'none';
      setTimeout(() => {
        alert("Game Over! Returning to Main Menu.");
        showScreen('main-menu');
      }, 1500);
    }

    function nextStage() {
      userData.stage += 1;
      updateDashboardUI();
      openStage();
    }

    function changeBackground(bgPath) {
      document.getElementById('stage-screen').style.backgroundImage = `url('${bgPath}')`;
    }
  </script>
</body>
</html>
