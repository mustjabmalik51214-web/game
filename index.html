<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT ALPHA - CREATED BY MUHAMMAD TAQI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0f0c20;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .active-screen {
            display: flex;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: linear-gradient(45deg, #ff0055, #7a00ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .user-info {
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #7a00ff;
            font-size: 1.1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 80%;
            max-width: 500px;
        }

        .menu-btn {
            padding: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .store-container {
            width: 90%;
            height: 75%;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .store-card {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .store-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        #iframe-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
        }

        #iframe-modal iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-iframe {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 1000;
            background: #ff0055;
        }

        .stages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            width: 80%;
            max-height: 60vh;
            overflow-y: auto;
        }

        .stage-btn {
            width: 100%;
            height: 80px;
            font-size: 1.2rem;
            margin: 0;
        }

        .stage-btn.locked {
            background: #333;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #gameplay-screen {
            background-size: cover;
            background-position: center;
            justify-content: space-between;
            padding: 20px 0;
        }

        .battlefield {
            width: 100%;
            height: 60%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 50px;
            position: relative;
        }

        .team-container {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .unit img {
            height: 120px;
            object-fit: contain;
        }

        .hp-bar-bg {
            width: 60px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: #00ff66;
            width: 100%;
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            align-items: center;
        }

        .nav-controls button {
            width: 70px;
            height: 70px;
            font-size: 1.5rem;
            border-radius: 50%;
        }

        .fire-btn {
            width: 90px;
            height: 90px;
            font-size: 1.2rem;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0000, #ff5500);
        }
    </style>
</head>
<body>

    <!-- Registration Screen -->
    <div id="register-screen" class="screen">
        <div class="glass-card">
            <div class="title" onclick="openNexura()">PROJECT ALPHA</div>
            <div class="subtitle">CREATED BY MUHAMMAD TAQI</div>
            <p>ENTER YOUR NAME TO START YOUR JOURNEY</p>
            <input type="text" id="username-input" placeholder="Your Name...">
            <br>
            <button onclick="saveName()">SAVE & CONTINUE</button>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <div class="top-bar">
            <div class="title" style="font-size: 1.8rem;" onclick="openNexura()">PROJECT ALPHA</div>
            <div class="user-info">
                <span id="display-username">Player</span> | Coins: <span id="display-coins" style="color: #ffd700;">500</span>
            </div>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" onclick="showScreen('characters-screen')">Characters</button>
            <button class="menu-btn" onclick="showScreen('guns-screen')">Guns Store</button>
            <button class="menu-btn" onclick="showScreen('bots-screen')">Bot Store</button>
            <button class="menu-btn" onclick="openStagesScreen()" style="grid-column: span 2; background: linear-gradient(45deg, #00ff66, #007a3d);">FIGHT</button>
        </div>
    </div>

    <!-- Character Store Screen -->
    <div id="characters-screen" class="screen">
        <div class="top-bar">
            <h2>CHARACTER STORE</h2>
            <button onclick="showScreen('home-screen')">BACK</button>
        </div>
        <div class="store-container" id="characters-container"></div>
    </div>

    <!-- Guns Store Screen -->
    <div id="guns-screen" class="screen">
        <div class="top-bar">
            <h2>GUNS STORE</h2>
            <button onclick="showScreen('home-screen')">BACK</button>
        </div>
        <div class="store-container" id="guns-container"></div>
    </div>

    <!-- Bot Store Screen -->
    <div id="bots-screen" class="screen">
        <div class="top-bar">
            <h2>BOT STORE</h2>
            <button onclick="showScreen('home-screen')">BACK</button>
        </div>
        <div class="glass-card" style="width: 300px;">
            <img src="characters/bot.jfif" style="width: 100%; border-radius: 8px; height: 180px; object-fit: cover;">
            <h3>FRIENDLY BOT</h3>
            <p>HP: 200 | WEAPON: AK47</p>
            <p style="margin: 10px 0;">PRICE: 2000 COINS</p>
            <p>OWNED BOTS: <span id="owned-bots-count">0</span></p>
            <button onclick="buyBot()">BUY BOT</button>
        </div>
    </div>

    <!-- Stages Selection Screen -->
    <div id="stages-screen" class="screen">
        <div class="top-bar">
            <h2>SELECT STAGE</h2>
            <button onclick="showScreen('home-screen')">BACK</button>
        </div>
        <div class="stages-grid" id="stages-container"></div>
    </div>

    <!-- Gameplay Screen -->
    <div id="gameplay-screen" class="screen">
        <div class="top-bar">
            <div class="user-info" id="stage-title">STAGE 1</div>
            <button onclick="leaveBattle()" style="background: #ff0055;">QUIT</button>
        </div>

        <div class="battlefield" id="battlefield">
            <div class="team-container" id="user-team"></div>
            <div class="team-container" id="enemy-team"></div>
        </div>

        <div class="controls">
            <div class="nav-controls">
                <button onclick="moveTeam(-20)">◄</button>
                <button onclick="moveTeam(20)">►</button>
            </div>
            <button class="fire-btn" onclick="playerAttack()">FIRE</button>
        </div>
    </div>

    <!-- Fullscreen Iframe Modal -->
    <div id="iframe-modal">
        <button class="close-iframe" onclick="closeIframe()">CLOSE</button>
        <iframe src="https://muhammad-taqi512-lyra.hf.space" frameborder="0"></iframe>
    </div>

    <script>
        let playerData = {
            name: '',
            coins: 500,
            unlockedStage: 1,
            ownedCharacters: ['character.jfif'],
            selectedCharacter: 'character.jfif',
            ownedGuns: ['ak47.jfif'],
            selectedGun: 'ak47.jfif',
            botsCount: 0
        };

        const characterList = [
            { name: 'Default Hero', file: 'character.jfif', price: 0, hp: 250 },
            { name: 'Akshay Kumar', file: 'akshay kumar.jfif', price: 5000, hp: 1000 },
            { name: 'Head Master', file: 'head.jfif', price: 10000, hp: 2000 },
            { name: 'Ira Agent', file: 'ira.jfif', price: 15000, hp: 3000 },
            { name: 'Mark Hunter', file: 'mark.jfif', price: 20000, hp: 4000 },
            { name: 'Master Mind', file: 'master.jfif', price: 25000, hp: 5000 },
            { name: 'Mister Z', file: 'mister z.jfif', price: 30000, hp: 6000 },
            { name: 'Salman Khan', file: 'salman khan.jfif', price: 35000, hp: 7000 },
            { name: 'Sira Commander', file: 'sira.jfif', price: 40000, hp: 8000 },
            { name: 'Sonia Elite', file: 'sonia.jfif', price: 45000, hp: 9000, isPasswordProtected: true },
            { name: 'Tiger Shroff', file: 'tiger shroff.jfif', price: 50000, hp: 10000 }
        ];

        const gunList = [
            { name: 'AK47', file: 'ak47.jfif', damage: 12, special: false },
            { name: 'AUG', file: 'aug.jfif', damage: 50, special: false },
            { name: 'AWM', file: 'awm.jfif', damage: 200, special: true },
            { name: 'M4A1', file: 'm4a1.jfif', damage: 80, special: false },
            { name: 'MACHINE GUN', file: 'machine gun.jfif', damage: 999, special: true, isMachine: true },
            { name: 'MP40', file: 'mp40.jfif', damage: 20, price: 5000, special: false },
            { name: 'MP5 EVO', file: 'mp5-evo.jfif', damage: 30, special: false },
            { name: 'MP5', file: 'mp5.jfif', damage: 40, price: 10000, special: false },
            { name: 'SCAR', file: 'scar.jfif', damage: 60, special: false },
            { name: 'SVD', file: 'svd.jfif', damage: 200, special: true },
            { name: 'TACTICAL', file: 'tactical.jfif', damage: 90, special: false }
        ];

        const bgList = ['ground.jfif', 'ground1.jfif', 'ground2.jfif', 'desert.jfif'];

        let currentStage = 1;
        let currentEnemies = [];
        let currentTeam = [];
        let teamPosition = 0;

        window.onload = function() {
            const savedName = localStorage.getItem('alpha_username');
            if (savedName) {
                playerData.name = savedName;
                const savedData = localStorage.getItem('alpha_playerdata');
                if (savedData) playerData = JSON.parse(savedData);
                enterHome();
            } else {
                showScreen('register-screen');
            }
        };

        function saveData() {
            localStorage.setItem('alpha_playerdata', JSON.stringify(playerData));
        }

        function saveName() {
            const nameInput = document.getElementById('username-input').value.trim();
            if (nameInput) {
                playerData.name = nameInput;
                localStorage.setItem('alpha_username', nameInput);
                saveData();
                enterHome();
            }
        }

        function enterHome() {
            document.getElementById('display-username').innerText = playerData.name;
            document.getElementById('display-coins').innerText = playerData.coins;
            showScreen('home-screen');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
            
            if (screenId === 'characters-screen') renderCharacters();
            if (screenId === 'guns-screen') renderGuns();
            if (screenId === 'bots-screen') document.getElementById('owned-bots-count').innerText = playerData.botsCount;
        }

        function openNexura() {
            window.open('https://nexura.oneapp.dev/', '_blank');
        }

        function renderCharacters() {
            const container = document.getElementById('characters-container');
            container.innerHTML = '';
            
            characterList.forEach(char => {
                const owned = playerData.ownedCharacters.includes(char.file);
                const selected = playerData.selectedCharacter === char.file;
                
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <img src="characters/${char.file}" alt="${char.name}">
                    <h3>${char.name}</h3>
                    <p>HP: ${char.hp}</p>
                    <p>Price: ${char.price === 0 ? 'DEFAULT' : char.isPasswordProtected ? 'SECRET PASSWORD' : char.price + ' Coins'}</p>
                    <button onclick="${owned ? `selectCharacter('${char.file}')` : `buyCharacter('${char.file}', ${char.price}, ${char.isPasswordProtected || false}, '${char.name}')`}">
                        ${selected ? 'EQUIPPED' : owned ? 'EQUIP' : 'BUY'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function buyCharacter(file, price, isPasswordProtected, name) {
            if (isPasswordProtected) {
                const passwordInput = prompt(`Enter Password to unlock ${name}:`);
                if (passwordInput) {
                    const reqPassword = playerData.name + "MT" + playerData.name + playerData.name.length + name;
                    if (passwordInput.trim() === reqPassword) {
                        playerData.ownedCharacters.push(file);
                        playerData.selectedCharacter = file;
                        saveData();
                        enterHome();
                        renderCharacters();
                        alert(`${name} Unlocked Successfully!`);
                    } else {
                        alert("Incorrect Password!");
                    }
                }
                return;
            }

            if (playerData.coins >= price) {
                playerData.coins -= price;
                playerData.ownedCharacters.push(file);
                playerData.selectedCharacter = file;
                saveData();
                enterHome();
                renderCharacters();
            } else {
                alert('Not enough coins!');
            }
        }

        function selectCharacter(file) {
            playerData.selectedCharacter = file;
            saveData();
            renderCharacters();
        }

        function renderGuns() {
            const container = document.getElementById('guns-container');
            container.innerHTML = '';

            gunList.forEach(gun => {
                const owned = playerData.ownedGuns.includes(gun.file);
                const selected = playerData.selectedGun === gun.file;

                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <img src="gun/${gun.file}" alt="${gun.name}">
                    <h3>${gun.name}</h3>
                    <p>Damage: ${gun.damage}</p>
                    <button onclick="handleGunClick('${gun.name}', '${gun.file}', ${gun.special})">
                        ${selected ? 'EQUIPPED' : owned ? 'EQUIP' : 'BUY'}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function handleGunClick(name, file, isSpecial) {
            const owned = playerData.ownedGuns.includes(file);
            if (owned) {
                playerData.selectedGun = file;
                saveData();
                renderGuns();
                return;
            }

            if (isSpecial) {
                const choice = prompt("Type 'BUY' to open browser frame OR Enter Secret Password:");
                if (choice) {
                    const reqPassword = playerData.name + "MT" + playerData.name + playerData.name.length + name;
                    if (choice.trim() === reqPassword) {
                        playerData.ownedGuns.push(file);
                        playerData.selectedGun = file;
                        saveData();
                        renderGuns();
                        alert("Weapon Unlocked!");
                    } else if (choice.trim().toUpperCase() === "BUY") {
                        document.getElementById('iframe-modal').style.display = 'block';
                    } else {
                        alert("Incorrect Password!");
                    }
                }
            } else {
                const gun = gunList.find(g => g.file === file);
                const price = gun.price || 5000;
                if (playerData.coins >= price) {
                    playerData.coins -= price;
                    playerData.ownedGuns.push(file);
                    playerData.selectedGun = file;
                    saveData();
                    enterHome();
                    renderGuns();
                } else {
                    alert('Not enough coins!');
                }
            }
        }

        function closeIframe() {
            document.getElementById('iframe-modal').style.display = 'none';
        }

        function buyBot() {
            if (playerData.coins >= 2000) {
                playerData.coins -= 2000;
                playerData.botsCount++;
                saveData();
                enterHome();
                document.getElementById('owned-bots-count').innerText = playerData.botsCount;
            } else {
                alert('Not enough coins!');
            }
        }

        function openStagesScreen() {
            showScreen('stages-screen');
            const container = document.getElementById('stages-container');
            container.innerHTML = '';

            for (let i = 1; i <= playerData.unlockedStage + 5; i++) {
                const btn = document.createElement('button');
                btn.className = `stage-btn ${i > playerData.unlockedStage ? 'locked' : ''}`;
                btn.innerText = `Stage ${i}`;
                if (i <= playerData.unlockedStage) {
                    btn.onclick = () => startStage(i);
                }
                container.appendChild(btn);
            }
        }

        function startStage(stageNum) {
            currentStage = stageNum;
            showScreen('gameplay-screen');
            
            const randomBg = bgList[Math.floor(Math.random() * bgList.length)];
            document.getElementById('gameplay-screen').style.backgroundImage = `url('bg/${randomBg}')`;
            document.getElementById('stage-title').innerText = `STAGE ${stageNum}`;

            const charData = characterList.find(c => c.file === playerData.selectedCharacter) || characterList[0];
            currentTeam = [{ id: 'player', type: 'user', hp: charData.hp, maxHp: charData.hp, img: `characters/${playerData.selectedCharacter}` }];

            for (let i = 0; i < playerData.botsCount; i++) {
                currentTeam.push({ id: `bot_${i}`, type: 'bot', hp: 200, maxHp: 200, img: 'characters/bot.jfif' });
            }

            currentEnemies = [];
            for (let i = 0; i < stageNum; i++) {
                currentEnemies.push({ id: `enemy_${i}`, hp: 200, maxHp: 200, img: 'stage/enemy.jpg' });
            }

            teamPosition = 0;
            renderBattlefield();
        }

        function renderBattlefield() {
            const uTeam = document.getElementById('user-team');
            const eTeam = document.getElementById('enemy-team');
            
            uTeam.innerHTML = '';
            eTeam.innerHTML = '';

            const distanceMargin = 50 + (currentStage * 20) + teamPosition;
            uTeam.style.marginRight = `${Math.max(10, distanceMargin)}px`;

            currentTeam.forEach(unit => {
                if (unit.hp > 0) {
                    uTeam.innerHTML += `
                        <div class="unit">
                            <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${(unit.hp/unit.maxHp)*100}%"></div></div>
                            <img src="${unit.img}">
                        </div>
                    `;
                }
            });

            currentEnemies.forEach(unit => {
                if (unit.hp > 0) {
                    eTeam.innerHTML += `
                        <div class="unit">
                            <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${(unit.hp/unit.maxHp)*100}%"></div></div>
                            <img src="${unit.img}">
                        </div>
                    `;
                }
            });
        }

        function moveTeam(amount) {
            teamPosition += amount;
            renderBattlefield();
        }

        function playerAttack() {
            const activeGun = gunList.find(g => g.file === playerData.selectedGun) || gunList[0];

            if (activeGun.isMachine) {
                let aliveEnemies = currentEnemies.filter(e => e.hp > 0);
                let killCount = Math.ceil(aliveEnemies.length / 2);
                for (let i = 0; i < killCount; i++) {
                    if (aliveEnemies[i]) aliveEnemies[i].hp = 0;
                }
            } else {
                let enemy = currentEnemies.find(e => e.hp > 0);
                if (enemy) {
                    enemy.hp -= activeGun.damage;
                }

                currentTeam.forEach(unit => {
                    if (unit.type === 'bot' && unit.hp > 0) {
                        let target = currentEnemies.find(e => e.hp > 0);
                        if (target) target.hp -= 12;
                    }
                });
            }

            currentEnemies.forEach(enemy => {
                if (enemy.hp > 0) {
                    let aliveTeam = currentTeam.filter(u => u.hp > 0);
                    if (aliveTeam.length > 0) {
                        let randomTarget = aliveTeam[Math.floor(Math.random() * aliveTeam.length)];
                        randomTarget.hp -= 12;
                    }
                }
            });

            renderBattlefield();
            checkBattleStatus();
        }

        function checkBattleStatus() {
            const aliveEnemies = currentEnemies.filter(e => e.hp > 0);
            const aliveTeam = currentTeam.filter(u => u.hp > 0);

            if (aliveEnemies.length === 0) {
                let reward = (currentStage === playerData.unlockedStage) ? 500 : 200;
                playerData.coins += reward;
                
                if (currentStage === playerData.unlockedStage) {
                    playerData.unlockedStage++;
                }
                saveData();
                alert(`VICTORY! You earned ${reward} coins.`);
                enterHome();
            } else if (aliveTeam.length === 0) {
                alert("DEFEAT! Your squad was defeated.");
                enterHome();
            }
        }

        function leaveBattle() {
            enterHome();
        }
    </script>
</body>
</html>
