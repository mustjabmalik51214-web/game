<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My World - Created by Muhammad Taqi</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Sarabun', sans-serif; background: #1a1a1a; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        #overlay, #pause-overlay {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 100;
        }

        #pause-overlay { display: none; background: rgba(0,0,0,0.8); z-index: 200; }

        .menu-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 40px; border: 3px solid #f1c40f;
            width: 450px; pointer-events: auto; text-align: center; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        button {
            padding: 12px 30px; font-size: 1.1em; cursor: pointer; background: #f1c40f; color: #000;
            border: none; border-radius: 50px; transition: 0.3s; font-weight: bold;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4); margin: 10px;
        }
        button:hover { transform: scale(1.05); background: #fff; }

        #quiz-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 30px; width: 420px;
            display: none; pointer-events: auto; border: 8px solid #f1c40f;
            box-shadow: 0 0 100px rgba(0,0,0,0.5); text-align: center;
        }

        #hud {
            position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5);
            padding: 15px 30px; border-radius: 50px; border-left: 8px solid #f1c40f;
        }

        /* On-screen controls (visible on all devices) */
        #on-screen-controls {
            position: absolute; bottom: 20px; left: 0; right: 0; pointer-events: none; z-index: 50;
        }
        .ctrl-btn {
            width: 50px; height: 50px; background: rgba(255,255,255,0.25); border: 2px solid #f1c40f; color: #fff;
            border-radius: 10px; font-size: 1.2em; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
            pointer-events: auto;
        }
        .ctrl-btn:active { background: #f1c40f; color: #000; }
        .dpad {
            position: absolute; left: 20px; bottom: 20px; display: grid;
            grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 5px;
        }
        .action-btns {
            position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .btn-wide { width: 60px; height: 60px; border-radius: 50%; font-size: 0.8em; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="menu-card">
            <h1 style="font-size: 2.2em; margin-bottom: 10px;">MY WORLD<br><span style="color:#f1c40f;">CREATED BY MUHAMMAD TAQI</span></h1>
            <p style="opacity: 0.9;">Created by <a href="https://taqi.oneapp.dev" target="_blank" style="color:#f1c40f; text-decoration:none;">Muhammad Taqi</a></p>
            <input type="text" id="player-name-input" placeholder="Enter your name..." 
                   style="width:80%; padding:15px; border-radius:15px; border:none; margin:20px 0; font-size:1.1em; text-align:center;">
            <br>
            <button onclick="startGame()">Enter 3D World</button>
        </div>
    </div>

    <div id="pause-overlay">
        <div class="menu-card">
            <h1 style="color:#f1c40f;">GAME PAUSED</h1>
            <p>Take a break...</p>
            <button onclick="togglePause()">RESUME</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="hud">
            <div id="display-name" style="font-weight:bold; color:#f1c40f;">-</div>
            <div id="score-text">Knowledge: 0 / 100</div>
        </div>
        <div id="quiz-popup">
            <h2 id="npc-name-display" style="color:#2c3e50; margin-top:0;">👤 Villager</h2>
            <p id="question-text" style="font-size: 1.2em; color: #333; font-weight: bold;"></p>
            <div id="options"></div>
        </div>
    </div>

    <!-- On-screen controls (always visible, work with mouse & touch) -->
    <div id="on-screen-controls">
        <div class="dpad">
            <button class="ctrl-btn" data-key="KeyW" style="grid-column:2;">▲</button>
            <button class="ctrl-btn" data-key="KeyA" style="grid-column:1; grid-row:2;">◀</button>
            <button class="ctrl-btn" data-key="KeyS" style="grid-column:2; grid-row:2;">▼</button>
            <button class="ctrl-btn" data-key="KeyD" style="grid-column:3; grid-row:2;">▶</button>
        </div>
        <div class="action-btns">
            <button class="ctrl-btn btn-wide" data-key="Space">JUMP</button>
            <button class="ctrl-btn btn-wide" data-key="ShiftLeft">RUN</button>
            <button class="ctrl-btn btn-wide" id="pause-btn">PAUSE</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, clock, player;
        let villagers = [], objects = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false;
        let canJump = true, velocity = new THREE.Vector3();
        let score = 0, gameActive = false, isPaused = false;

        const npcData = [
            { name: "Uncle Son (Village Chief)", q: "Thailand shares a border with Laos in which direction?", a: ["North and East", "South", "West"], cor: 0, pos: {x: 10, z: 10}, color: 0x27ae60 },
            { name: "Aunt Jai (Fruit Seller)", q: "The south of Thailand borders which country?", a: ["Myanmar", "Malaysia", "Cambodia"], cor: 1, pos: {x: -15, z: 20}, color: 0xe67e22 },
            { name: "Brother Khem (Ranger)", q: "Which river forms part of the border between Thailand and Laos in the northeast?", a: ["Chao Phraya River", "Mekong River", "Ping River"], cor: 1, pos: {x: 40, z: -30}, color: 0x145a32 },
            { name: "Teacher Fah", q: "To the west, Thailand shares a border with which country?", a: ["Myanmar (Burma)", "Vietnam", "Singapore"], cor: 0, pos: {x: -30, z: -40}, color: 0x3498db },
            { name: "Nong Keng (Student)", q: "How many colors are on the Thai flag?", a: ["3 colors", "4 colors", "5 colors"], cor: 0, pos: {x: 0, z: 50}, color: 0xf1c40f },
            { name: "Uncle Toi (Fisherman)", q: "Eastern Thailand borders Cambodia and which sea?", a: ["Andaman Sea", "Gulf of Thailand", "South China Sea"], cor: 1, pos: {x: 60, z: 20}, color: 0x1a5276 },
            { name: "Aunt Wan (Merchant)", q: "The white color in the Thai flag represents what?", a: ["The monarchy", "Religion", "The nation"], cor: 1, pos: {x: -50, z: 10}, color: 0xecf0f1 },
            { name: "P'Nok (Journalist)", q: "The southernmost point of Thailand is in which province?", a: ["Yala", "Satun", "Songkhla"], cor: 0, pos: {x: 20, z: -60}, color: 0x884ea0 },
            { name: "Ta Bun (Driver)", q: "Thailand's shape is often compared to what?", a: ["A shoe", "An ancient axe", "A fan"], cor: 1, pos: {x: -60, z: -20}, color: 0x784212 },
            { name: "Grandma Maem (Kind person)", q: "Mae Sai checkpoint is a border crossing to which country?", a: ["Laos", "Myanmar (Burma)", "Malaysia"], cor: 1, pos: {x: 45, z: 55}, color: 0x7d6608 }
        ];

        window.startGame = () => {
            const name = document.getElementById('player-name-input').value || "Explorer";
            document.getElementById('display-name').innerText = "👤 " + name;
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            // No need to request pointer lock – on-screen buttons are always there.
            // But we can still request pointer lock for desktop if wanted (optional).
            // document.body.requestPointerLock();
        };

        window.togglePause = () => {
            if(!gameActive) return;
            isPaused = !isPaused;
            const pauseMenu = document.getElementById('pause-overlay');
            if(isPaused) {
                pauseMenu.style.display = 'flex';
            } else {
                pauseMenu.style.display = 'none';
            }
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.domElement.style.touchAction = 'none';
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshLambertMaterial({ color: 0x2d8a39 }));
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            npcData.forEach(data => spawnAdvancedNPC(data));

            for(let i=0; i<30; i++) {
                if(i < 15) createHouse(Math.random()*200-50, 0, Math.random()*200-90);
                createMountain(Math.random()*300-50, Math.random()*300-150);
                createTree(Math.random()*200-100, Math.random()*200-100);
            }

            createPlayer();
            setupControls();
            animate();
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshLambertMaterial({color: 0x5d4037}));
            trunk.position.y = 1;
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshLambertMaterial({color: 0x2e7d32}));
            leaves.position.y = 2.5;
            group.add(trunk, leaves);
            group.position.set(x, 0, z);
            scene.add(group);
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.7, 4, 8), new THREE.MeshLambertMaterial({color: 0x3498db}));
            body.position.y = 0.7;
            body.castShadow = true;
            player.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshLambertMaterial({color: 0xffdbac}));
            head.position.y = 1.35;
            player.add(head);

            const limbGeo = new THREE.BoxGeometry(0.15, 0.6, 0.15);
            player.lArm = new THREE.Mesh(limbGeo, new THREE.MeshLambertMaterial({color: 0x3498db}));
            player.lArm.position.set(0.4, 0.8, 0);
            player.add(player.lArm);
            player.rArm = new THREE.Mesh(limbGeo, new THREE.MeshLambertMaterial({color: 0x3498db}));
            player.rArm.position.set(-0.4, 0.8, 0);
            player.add(player.rArm);
            player.lLeg = new THREE.Mesh(limbGeo, new THREE.MeshLambertMaterial({color: 0x2c3e50}));
            player.lLeg.position.set(0.15, 0.3, 0);
            player.add(player.lLeg);
            player.rLeg = new THREE.Mesh(limbGeo, new THREE.MeshLambertMaterial({color: 0x2c3e50}));
            player.rLeg.position.set(-0.15, 0.3, 0);
            player.add(player.rLeg);

            scene.add(player);
        }

        function spawnAdvancedNPC(data) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), new THREE.MeshLambertMaterial({color: data.color}));
            body.position.y = 0.85;
            group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), new THREE.MeshLambertMaterial({color: 0xffdbac}));
            head.position.y = 1.55;
            group.add(head);
            const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), new THREE.MeshLambertMaterial({color: 0x333333}));
            hat.position.y = 1.8;
            group.add(hat);

            group.position.set(data.pos.x, 0, data.pos.z);
            group.userData = data;
            scene.add(group);
            villagers.push(group);
        }

        function createHouse(x, y, z) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshLambertMaterial({color: 0xecf0f1}));
            base.position.y = 2;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 3, 4), new THREE.MeshLambertMaterial({color: 0xc0392b}));
            roof.position.y = 5.5; roof.rotation.y = Math.PI/4;
            group.add(base, roof);
            group.position.set(x, y, z);
            scene.add(group);
            objects.push(base);
        }

        function createMountain(x, z) {
            const mt = new THREE.Mesh(new THREE.ConeGeometry(10 + Math.random()*10, 8 + Math.random()*12, 52), new THREE.MeshLambertMaterial({color: 0x672d}));
            mt.position.set(x, 0, z);
            if(Math.abs(x) < 20 && Math.abs(z) < 20) mt.position.x += 50;
            scene.add(mt);
        }

        function setupControls() {
            // Keyboard controls (still work for PC)
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyP') togglePause();
                if(isPaused) return;

                if(e.code === 'KeyW') moveForward = true;
                if(e.code === 'KeyS') moveBackward = true;
                if(e.code === 'KeyA') moveLeft = true;
                if(e.code === 'KeyD') moveRight = true;
                if(e.code === 'ShiftLeft') isRunning = true;
                if(e.code === 'Space' && canJump) { velocity.y = 10; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveForward = false;
                if(e.code === 'KeyS') moveBackward = false;
                if(e.code === 'KeyA') moveLeft = false;
                if(e.code === 'KeyD') moveRight = false;
                if(e.code === 'ShiftLeft') isRunning = false;
            });

            // Mouse look (optional for desktop)
            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement === document.body && gameActive && !isPaused) {
                    player.rotation.y -= e.movementX * 0.002;
                }
            });

            // Touch rotation for mobile (drag on canvas)
            let lastTouchX = null;
            renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    lastTouchX = e.touches[0].clientX;
                }
                e.preventDefault();
            }, {passive: false});
            renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && lastTouchX !== null) {
                    const deltaX = e.touches[0].clientX - lastTouchX;
                    player.rotation.y -= deltaX * 0.005;
                    lastTouchX = e.touches[0].clientX;
                }
                e.preventDefault();
            }, {passive: false});
            renderer.domElement.addEventListener('touchend', () => {
                lastTouchX = null;
            });

            // Bind on-screen buttons (work with both mouse and touch)
            document.querySelectorAll('.ctrl-btn[data-key]').forEach(btn => {
                const key = btn.dataset.key;
                const press = () => {
                    const evt = new KeyboardEvent('keydown', { code: key });
                    document.dispatchEvent(evt);
                };
                const release = () => {
                    const evt = new KeyboardEvent('keyup', { code: key });
                    document.dispatchEvent(evt);
                };

                // Mouse events
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    press();
                });
                btn.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    release();
                });
                btn.addEventListener('mouseleave', (e) => {
                    // If mouse leaves the button while pressed, release
                    release();
                });

                // Touch events
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    press();
                });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    release();
                });
                btn.addEventListener('touchcancel', (e) => {
                    release();
                });
            });

            // Pause button
            document.getElementById('pause-btn').addEventListener('click', (e) => {
                e.preventDefault();
                togglePause();
            });
            document.getElementById('pause-btn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                togglePause();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive || isPaused) return;

            const delta = clock.getDelta();
            const time = clock.elapsedTime;

            velocity.y -= 25.0 * delta;

            const currentSpeed = isRunning ? 28.0 : 8.0;
            let moveVector = new THREE.Vector3(0, 0, 0);

            if (moveForward)  moveVector.z -= 1;
            if (moveBackward) moveVector.z += 1;
            if (moveLeft)     moveVector.x -= 1;
            if (moveRight)    moveVector.x += 1;

            if (moveVector.length() > 0) {
                moveVector.normalize();
                moveVector.multiplyScalar(currentSpeed * delta);
                player.translateX(moveVector.x);
                player.translateZ(moveVector.z);
            }

            player.position.y += velocity.y * delta;

            if (player.position.y < 0) {
                velocity.y = 0;
                player.position.y = 0;
                canJump = true;
            }

            if(moveForward || moveBackward || moveLeft || moveRight) {
                const animS = isRunning ? 15 : 8;
                player.lLeg.rotation.x = Math.sin(time * animS) * 0.8;
                player.rLeg.rotation.x = -Math.sin(time * animS) * 0.8;
                player.lArm.rotation.x = -Math.sin(time * animS) * 0.8;
                player.rArm.rotation.x = Math.sin(time * animS) * 0.8;
            }

            villagers.forEach(v => {
                if(player.position.distanceTo(v.position) < 2.5) openAdvancedQuiz(v);
            });

            const camPos = new THREE.Vector3(0, 5, 8).applyQuaternion(player.quaternion);
            camera.position.lerp(player.position.clone().add(camPos), 0.1);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));

            renderer.render(scene, camera);
        }

        function openAdvancedQuiz(npc) {
            if(document.getElementById('quiz-popup').style.display === 'block') return;
            const popup = document.getElementById('quiz-popup');
            popup.style.display = 'block';

            const data = npc.userData;
            document.getElementById('npc-name-display').innerText = "👤 " + data.name;
            document.getElementById('question-text').innerText = data.q;

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';

            data.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.innerText = ans;
                btn.style.width = "100%"; btn.style.margin = "8px 0";
                btn.onclick = () => {
                    if(i === data.cor) {
                        score += 10;
                        alert("Correct! " + data.name + " is very impressed.");
                    } else {
                        alert("Not quite right – try again later!");
                    }
                    document.getElementById('score-text').innerText = "Knowledge: " + score + " / 100";
                    popup.style.display = 'none';
                    player.translateZ(4);
                };
                optDiv.appendChild(btn);
            });
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
