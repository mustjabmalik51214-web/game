<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Sniper - Cyberpunk Sharpshooter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-dark: #090d16;
        --card-bg: rgba(15, 23, 42, 0.85);
        --accent: #ff0055; /* Neon Pink/Red */
        --accent-glow: #ff2a75;
        --cyan: #00f0ff;
        --gold: #ffbe0b;
        --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }

    body {
        background: var(--bg-dark);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Top Header HUD */
    header {
        background: rgba(9, 13, 22, 0.95);
        padding: 12px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--accent);
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        z-index: 50;
    }

    .brand { 
        font-family: 'Orbitron', sans-serif; 
        font-size: 24px; 
        font-weight: 900; 
        color: var(--accent); 
        letter-spacing: 2px; 
        text-shadow: 0 0 10px var(--accent-glow);
    }

    .hud-info { display: flex; gap: 15px; align-items: center; }
    .coin-badge { 
        background: rgba(255, 190, 11, 0.1); 
        border: 1px solid var(--gold); 
        color: var(--gold); 
        padding: 6px 18px; 
        border-radius: 20px; 
        font-weight: 700; 
        box-shadow: 0 0 10px rgba(255, 190, 11, 0.2);
    }
    .user-badge { 
        background: rgba(0, 240, 255, 0.1); 
        border: 1px solid var(--cyan); 
        color: var(--cyan);
        padding: 6px 18px; 
        border-radius: 20px; 
        font-size: 14px; 
        cursor: pointer; 
        transition: 0.3s;
    }
    .user-badge:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

    .view-container { flex-grow: 1; position: relative; overflow: hidden; }
    .view { display: none; padding: 30px; height: 100%; }
    .view.active { display: block; }

    /* Home View */
    .home-menu { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100%; 
        text-align: center;
        background: radial-gradient(circle at center, rgba(0, 240, 255, 0.1), transparent 70%);
    }
    .home-menu h1 { 
        font-family: 'Orbitron', sans-serif;
        font-size: 55px; 
        margin-bottom: 15px; 
        background: linear-gradient(45deg, var(--accent), var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.6));
    }
    
    .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
    
    .btn {
        background: var(--card-bg); 
        border: 2px solid var(--cyan); 
        color: white;
        padding: 14px 28px; 
        font-size: 15px; 
        font-weight: 700; 
        border-radius: 12px; 
        cursor: pointer;
        transition: 0.3s; 
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn:hover { 
        background: var(--cyan); 
        color: #000;
        box-shadow: 0 0 20px var(--cyan); 
        transform: translateY(-3px); 
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { 
        background: var(--accent-glow); 
        color: #fff;
        box-shadow: 0 0 25px var(--accent); 
    }

    /* Stages Grid */
    .stages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; height: 75vh; overflow-y: auto; padding-bottom: 50px; }
    .stage-box {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
        height: 85px; display: flex; justify-content: center; align-items: center;
        font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 800; border-radius: 14px; cursor: not-allowed; opacity: 0.4; transition: 0.3s;
    }
    .stage-box.unlocked { cursor: pointer; opacity: 1; border-color: var(--accent); color: var(--accent); background: rgba(255, 0, 85, 0.08); }
    .stage-box.unlocked:hover { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent); transform: scale(1.05); }

    /* Store Grid */
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; height: 70vh; overflow-y: auto; padding-bottom: 50px;}
    .store-item { background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.2); padding: 20px; border-radius: 16px; text-align: center; backdrop-filter: blur(10px); }
    .store-item h3 { margin-bottom: 10px; font-size: 18px; color: var(--cyan); }
    .store-item p { color: var(--gold); font-weight: 600; margin-bottom: 15px; }
    .store-item.premium p { color: #c084fc; }
    .buy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; background: white; color: black; transition: 0.2s;}
    .buy-btn.equip { background: var(--accent); color: white; }
    .buy-btn.equipped { background: #10b981; color: white; }

    /* Game UI */
    #gameArea { position: relative; width: 100%; height: 100%; background: #050811; overflow: hidden; cursor: crosshair; }
    #gameCanvas { display: block; transition: transform 0.05s ease-out; }
    .ammo-counter { 
        position: absolute; bottom: 25px; right: 25px; font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 800; 
        color: var(--gold); background: rgba(9, 13, 22, 0.85); padding: 12px 25px; border-radius: 12px; border: 2px solid var(--gold);
        box-shadow: 0 0 15px rgba(255, 190, 11, 0.3); backdrop-filter: blur(5px);
    }
    
    /* Scope Overlay */
    .scope-overlay { 
        position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; 
        background: radial-gradient(circle at center, transparent 18%, rgba(5, 8, 17, 0.98) 28%); 
        display: none; 
        transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .scope-overlay.active { display: block; }

    .crosshair-center { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        width: 2px; height: 50px; background: rgba(255, 0, 85, 0.8); pointer-events: none; display: none;
        box-shadow: 0 0 8px var(--accent);
    }
    .crosshair-center::after { 
        content:''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        width: 50px; height: 2px; background: rgba(255, 0, 85, 0.8); box-shadow: 0 0 8px var(--accent);
    }
    .scope-overlay.active + .crosshair-center { display: block; }

    /* Modals */
    .overlay { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(8px);}
    .modal-box { background: #0f172a; border: 2px solid var(--accent); padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(255, 0, 85, 0.3); }
    .modal-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--cyan); background: #090d16; color: white; outline: none; }
    .modal-box button { padding: 10px 20px; margin: 5px; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; }
    
    footer { background: #090d16; text-align: center; padding: 15px; border-top: 1px solid rgba(255,255,255,0.05); z-index: 50; }
    footer a { color: var(--cyan); text-decoration: none; font-weight: 700; letter-spacing: 1px; font-size: 14px; text-shadow: 0 0 8px var(--cyan); }
    .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--cyan); padding: 8px 20px; border-radius: 8px; cursor: pointer; z-index: 10;}
</style>
</head>
<body>

<header>
    <div class="brand">STICKMAN SNIPER SHOOTER</div>
    <div class="hud-info">
        <div class="coin-badge">🪙 <span id="ui-coins">0</span></div>
        <div class="user-badge" onclick="editUsername()">👤 <span id="ui-username">Muhammad Taqi</span></div>
    </div>
</header>

<div class="view-container">
    <!-- HOME VIEW -->
    <div id="homeView" class="view active">
        <div class="home-menu">
            <h1>Stickman SHOOTER</h1>
            <p style="color:#94a3b8; max-width: 500px; margin-bottom: 20px; line-height: 1.6;">Hover over stickmen to acquire <b>RED DOT LASER LOCK</b>. Click to open <b>SCOPE</b> and instantly ELIMINATE the target!</p>
            <div class="btn-group">
                <button class="btn primary" onclick="navTo('stagesView')">🎯 PLAY STAGES</button>
                <button class="btn" onclick="navTo('storeView'); renderStore('snipers');">🔫 SNIPER STORE</button>
                <button class="btn" onclick="navTo('storeView'); renderStore('characters');">👤 CHARACTER STORE</button>
            </div>
        </div>
    </div>

    <!-- STAGES VIEW -->
    <div id="stagesView" class="view">
        <button class="back-btn" onclick="navTo('homeView')">⬅ Back</button>
        <h2 style="text-align: center; margin-bottom: 30px; font-family: 'Orbitron'; color: var(--cyan);">SELECT MISSION</h2>
        <div class="stages-grid" id="stagesGrid"></div>
    </div>

    <!-- STORE VIEW -->
    <div id="storeView" class="view">
        <button class="back-btn" onclick="navTo('homeView')">⬅ Back</button>
        <h2 style="text-align: center; margin-bottom: 20px; font-family: 'Orbitron'; color: var(--cyan);" id="storeTitle">STORE</h2>
        <div class="btn-group" style="margin-bottom: 25px;">
            <button class="btn" onclick="renderStore('characters')">CHARACTERS</button>
            <button class="btn" onclick="renderStore('snipers')">SNIPERS</button>
        </div>
        <div class="store-grid" id="storeGrid"></div>
    </div>

    <!-- GAME VIEW -->
    <div id="gameView" class="view" style="padding: 0;">
        <div id="gameArea" onclick="handleGameClick(event)">
            <canvas id="gameCanvas"></canvas>
            <div class="scope-overlay" id="scopeOverlay"></div>
            <div class="crosshair-center"></div>
            <div class="ammo-counter">AMMO: <span id="gameAmmo">3</span></div>
        </div>
    </div>
</div>

<footer>
    <a href="https://nexura.oneapp.dev/" target="_blank">CREATED BY MUHAMMAD TAQI</a>
</footer>

<!-- Modals -->
<div class="overlay" id="resultModal">
    <div class="modal-box">
        <h2 id="resultTitle" style="font-family: 'Orbitron';">STAGE CLEARED</h2>
        <p id="resultMsg" style="color: var(--gold); font-size: 20px; font-weight: bold; margin: 15px 0;">+500 Coins</p>
        <button style="background: var(--accent); color: white;" onclick="navTo('stagesView'); closeModals()">Continue</button>
    </div>
</div>

<script>
    let user = {
        username: "Muhammad Taqi",
        coins: 1000,
        maxStage: 1,
        charsOwned: [0],
        snipersOwned: [0],
        charEquipped: 0,
        sniperEquipped: 0
    };

    const characters = [{ id: 0, name: "Default Cyber", price: 0, type: 'coin' }];
    const snipers = [{ id: 0, name: "Standard Sniper", price: 0, type: 'coin', zoom: 1 }];

    for (let i = 1; i <= 50; i++) {
        let price = i * 400;
        characters.push({ id: i, name: `Agent ${i}`, price: price, type: 'coin' });
        snipers.push({ id: i, name: `Hyper-Rifle ${i}`, price: price, type: 'coin', zoom: 1 + (i * 0.03) });
    }

    function loadData() {
        let saved = localStorage.getItem('sniper_game_save_beautiful');
        if (saved) user = JSON.parse(saved);
        updateHUD();
        buildStages();
    }
    
    function saveData() {
        localStorage.setItem('sniper_game_save_beautiful', JSON.stringify(user));
        updateHUD();
    }

    function updateHUD() {
        document.getElementById('ui-coins').innerText = user.coins;
        document.getElementById('ui-username').innerText = user.username;
    }

    function editUsername() {
        let newName = prompt("Enter your new Username:", user.username);
        if (newName && newName.trim() !== "") {
            user.username = newName.trim();
            saveData();
        }
    }

    function navTo(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if (viewId === 'stagesView') buildStages();
        if (viewId !== 'gameView') isGameRunning = false;
    }

    function buildStages() {
        const grid = document.getElementById('stagesGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 200; i++) {
            let box = document.createElement('div');
            box.className = `stage-box ${i <= user.maxStage ? 'unlocked' : ''}`;
            box.innerText = i;
            if (i <= user.maxStage) {
                box.onclick = () => initGame(i);
            }
            grid.appendChild(box);
        }
    }

    function renderStore(type) {
        document.getElementById('storeTitle').innerText = (type === 'characters' ? 'CHARACTER' : 'SNIPER') + ' STORE';
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';

        const items = type === 'characters' ? characters : snipers;
        const owned = type === 'characters' ? user.charsOwned : user.snipersOwned;
        const equipped = type === 'characters' ? user.charEquipped : user.sniperEquipped;

        items.forEach(item => {
            if(item.id === 0) return;
            let div = document.createElement('div');
            div.className = `store-item`;
            
            let isOwned = owned.includes(item.id);
            let isEquipped = (equipped === item.id);
            
            let statusHTML = '';
            if (isEquipped) {
                statusHTML = `<button class="buy-btn equipped">Equipped</button>`;
            } else if (isOwned) {
                statusHTML = `<button class="buy-btn equip" onclick="equipItem('${type}', ${item.id})">Equip</button>`;
            } else {
                statusHTML = `<button class="buy-btn" onclick="buyCoinItem('${type}', ${item.id})">Buy 🪙 ${item.price}</button>`;
            }

            div.innerHTML = `
                <h3>${item.name}</h3>
                <p>Price: 🪙 ${item.price}</p>
                ${statusHTML}
            `;
            grid.appendChild(div);
        });
    }

    function buyCoinItem(type, id) {
        const items = type === 'characters' ? characters : snipers;
        const item = items.find(i => i.id === id);
        if (user.coins >= item.price) {
            user.coins -= item.price;
            if (type === 'characters') user.charsOwned.push(id);
            else user.snipersOwned.push(id);
            saveData();
            renderStore(type);
        } else {
            alert("Not enough coins!");
        }
    }

    function equipItem(type, id) {
        if (type === 'characters') user.charEquipped = id;
        else user.sniperEquipped = id;
        saveData();
        renderStore(type);
    }

    function closeModals() {
        document.getElementById('resultModal').style.display = 'none';
    }

    // --- GAME ENGINE (COMPACT BEAUTIFUL WORLD) ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let isGameRunning = false;
    let currentStage = 1;
    let ammo = 3;
    
    // COMPACT WORLD MAP (Fit & Beautiful)
    const worldW = 1400;
    const worldH = 800;
    let cameraX = worldW / 2;
    let cameraY = worldH / 2;
    
    let targets = [];
    let scopeZoom = 1;
    let hoveredTarget = null;
    let isScoped = false;
    let laserPulse = 0;

    document.getElementById('gameArea').addEventListener('mousemove', (e) => {
        if(!isGameRunning || isScoped) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        
        let panX = (mx / canvas.width) - 0.5;
        let panY = (my / canvas.height) - 0.5;

        // Smooth Camera Movement in Compact Map
        cameraX = (worldW / 2) + (panX * 400);
        cameraY = (worldH / 2) + (panY * 250);
        
        cameraX = Math.max(canvas.width/2, Math.min(worldW - canvas.width/2, cameraX));
        cameraY = Math.max(canvas.height/2, Math.min(worldH - canvas.height/2, cameraY));

        detectHoverTarget(mx, my);
    });

    function detectHoverTarget(mx, my) {
        hoveredTarget = null;
        for(let t of targets) {
            if(t.isHit) continue;
            let screenX = t.x - (cameraX - canvas.width/2);
            let screenY = t.y - (cameraY - canvas.height/2);
            
            let dist = Math.hypot(screenX - mx, screenY - my);
            if(dist < 45) {
                hoveredTarget = t;
                break;
            }
        }
    }

    function initGame(stage) {
        currentStage = stage;
        ammo = 3;
        isScoped = false;
        hoveredTarget = null;
        document.getElementById('gameAmmo').innerText = ammo;
        document.getElementById('scopeOverlay').classList.remove('active');
        
        let equippedSniper = snipers.find(s => s.id === user.sniperEquipped);
        scopeZoom = equippedSniper.zoom;

        resizeCanvas();
        generateTargets(stage);
        
        isGameRunning = true;
        navTo('gameView');
        requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function generateTargets(stageNum) {
        targets = [];
        targets.push(createStickman(true)); // Target
        for(let i=0; i<Math.min(stageNum + 2, 25); i++) {
            targets.push(createStickman(false)); // Decoys
        }
    }

    function createStickman(isRed) {
        return {
            x: Math.random() * (worldW - 300) + 150,
            y: Math.random() * (worldH - 300) + 150,
            isRed: isRed,
            isHit: false,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5
        };
    }

    function drawStickman(t, screenX, screenY) {
        if(t.isHit) return;
        
        let scale = isScoped ? scopeZoom * 1.4 : 1;
        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.scale(scale, scale);

        // Visual Colors & Glow
        let mainColor = t.isRed ? '#ff0055' : '#00f0ff';
        ctx.strokeStyle = mainColor;
        ctx.shadowColor = mainColor;
        ctx.shadowBlur = 10;
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';

        // Head
        ctx.beginPath();
        ctx.arc(0, -25, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = mainColor;
        ctx.fill();

        // Body
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(0, 15);
        ctx.stroke();

        // Arms
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(-12, 2);
        ctx.moveTo(0, -10);
        ctx.lineTo(12, 2);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(-12, 35);
        ctx.moveTo(0, 15);
        ctx.lineTo(12, 35);
        ctx.stroke();

        // BEAUTIFUL RED DOT & TARGET LOCKING EFFECT
        if(hoveredTarget === t) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            
            // Outer Ring
            ctx.beginPath();
            ctx.arc(0, -5, 22 + Math.sin(laserPulse) * 3, 0, Math.PI * 2);
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Center Bright Red Dot
            ctx.beginPath();
            ctx.arc(0, -5, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0055';
            ctx.fill();
        }

        ctx.restore();
    }

    function drawCyberBackground() {
        // Futuristic Dark Grid Floor
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#050811');
        grad.addColorStop(1, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
        ctx.lineWidth = 1;
        let offsetX = -(cameraX - canvas.width/2) % 60;
        let offsetY = -(cameraY - canvas.height/2) % 60;
        
        for(let x=offsetX; x<canvas.width; x+=60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y=offsetY; y<canvas.height; y+=60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
    }

    function gameLoop() {
        if(!isGameRunning) return;

        laserPulse += 0.1;
        drawCyberBackground();

        targets.forEach(t => {
            t.x += t.vx; t.y += t.vy;
            if(t.x < 100 || t.x > worldW-100) t.vx *= -1;
            if(t.y < 100 || t.y > worldH-100) t.vy *= -1;

            let screenX = t.x - (cameraX - canvas.width/2);
            let screenY = t.y - (cameraY - canvas.height/2);

            drawStickman(t, screenX, screenY);
        });

        requestAnimationFrame(gameLoop);
    }

    function handleGameClick(e) {
        if(!isGameRunning || ammo <= 0) return;

        if(!isScoped) {
            // Lock Camera smooth to Target
            if(hoveredTarget) {
                cameraX = hoveredTarget.x;
                cameraY = hoveredTarget.y;
            }
            isScoped = true;
            document.getElementById('scopeOverlay').classList.add('active');
            
            // Auto Shoot
            setTimeout(() => {
                if(isGameRunning) fireGun();
            }, 250);
        } else {
            fireGun();
        }
    }

    function fireGun() {
        if(!isGameRunning || ammo <= 0) return;
        
        ammo--;
        document.getElementById('gameAmmo').innerText = ammo;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        let hitMade = false;
        for(let i=0; i<targets.length; i++) {
            let t = targets[i];
            if(t.isHit) continue;

            let screenX = t.x - (cameraX - canvas.width/2);
            let screenY = t.y - (cameraY - canvas.height/2);
            
            let hitbox = 45 * scopeZoom;
            let dist = Math.hypot(screenX - cx, screenY - cy);
            
            if(dist < hitbox) {
                t.isHit = true;
                hitMade = true;
                if(t.isRed) {
                    setTimeout(() => finishStage(true), 400);
                } else {
                    setTimeout(() => finishStage(false, "CIVILIAN CASUALTY!"), 400);
                }
                break;
            }
        }
        
        // Muzzle Shake
        canvas.style.transform = `scale(1.02) translate(${Math.random()*12-6}px, ${Math.random()*12-6}px)`;
        setTimeout(() => {
            canvas.style.transform = 'scale(1) translate(0,0)';
            document.getElementById('scopeOverlay').classList.remove('active');
            isScoped = false;
        }, 150);

        if(!hitMade && ammo === 0) {
            let redAlive = targets.some(t => t.isRed && !t.isHit);
            if(redAlive) {
                setTimeout(() => finishStage(false, "OUT OF AMMO!"), 400);
            }
        }
    }

    function finishStage(isWin, reason = "") {
        isGameRunning = false;
        isScoped = false;
        document.getElementById('scopeOverlay').classList.remove('active');
        
        let reward = 100;
        let title = isWin ? "TARGET ELIMINATED" : "MISSION FAILED";
        
        if (isWin) {
            if (currentStage === user.maxStage) {
                reward = 400;
                user.maxStage++;
            }
        }

        user.coins += reward;
        saveData();

        document.getElementById('resultTitle').innerText = title;
        document.getElementById('resultTitle').style.color = isWin ? '#00f0ff' : '#ff0055';
        document.getElementById('resultMsg').innerText = `+${reward} Coins ${!isWin ? '('+reason+')' : ''}`;
        
        document.getElementById('resultModal').style.display = 'flex';
    }

    loadData();
</script>
</body>
</html>
