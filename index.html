<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Offline Shooter - Full Combat Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { 
      touch-action: none; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow: hidden; 
      background: #0f172a; 
    }
    .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .ui-layer { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; }
    .interactive { pointer-events: auto; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    /* Crosshair Center Pointer */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body class="text-white font-sans">

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- In-Game Crosshair Overlay -->
  <div id="crosshair" class="hidden">
    <div class="w-6 h-6 relative flex items-center justify-center">
      <div class="absolute w-1 h-3 bg-red-500 top-0"></div>
      <div class="absolute w-1 h-3 bg-red-500 bottom-0"></div>
      <div class="absolute h-1 w-3 bg-red-500 left-0"></div>
      <div class="absolute h-1 w-3 bg-red-500 right-0"></div>
      <div class="w-1.5 h-1.5 bg-yellow-400 rounded-full"></div>
    </div>
  </div>

  <!-- UI Wrapper Layer -->
  <div class="ui-layer flex flex-col justify-between p-4">

    <!-- Top Bar Navigation HUD -->
    <header id="main-header" class="glass rounded-xl p-3 flex justify-between items-center interactive hidden">
      <div class="flex items-center gap-3">
        <span class="text-lg font-bold text-emerald-400" id="hud-username">Player</span>
        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300" id="hud-char-hp">HP: 200</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1 bg-slate-900/80 px-3 py-1 rounded-lg">
          <span>🪙</span><span id="hud-coins" class="font-semibold text-yellow-400">0</span>
        </div>
        <div class="flex items-center gap-1 bg-slate-900/80 px-3 py-1 rounded-lg">
          <span>💎</span><span id="hud-diamonds" class="font-semibold text-cyan-400">0</span>
          <button onclick="triggerDiamondPurchaseModal()" class="ml-2 bg-emerald-500 hover:bg-emerald-600 text-xs px-2 py-0.5 rounded font-bold">+</button>
        </div>
      </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav id="main-nav" class="flex justify-center gap-2 my-2 interactive hidden">
      <button onclick="openPanel('stages')" class="nav-btn bg-blue-600 px-4 py-2 rounded-lg font-semibold text-sm">Stages (100)</button>
      <button onclick="openPanel('guns')" class="nav-btn bg-slate-700 px-4 py-2 rounded-lg font-semibold text-sm">Guns Store</button>
      <button onclick="openPanel('chars')" class="nav-btn bg-slate-700 px-4 py-2 rounded-lg font-semibold text-sm">Characters</button>
      <button onclick="openPanel('bot')" class="nav-btn bg-slate-700 px-4 py-2 rounded-lg font-semibold text-sm">AI Bots</button>
    </nav>

    <!-- Content Panels Container -->
    <main id="panel-container" class="flex-1 overflow-y-auto interactive max-w-4xl w-full mx-auto my-2 hidden">
      <!-- Stages Panel -->
      <section id="panel-stages" class="panel-content glass rounded-xl p-4">
        <h2 class="text-xl font-bold mb-4 text-emerald-400">Select Stage</h2>
        <div id="stages-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3"></div>
      </section>

      <!-- Guns Panel -->
      <section id="panel-guns" class="panel-content glass rounded-xl p-4 hidden">
        <h2 class="text-xl font-bold mb-4 text-cyan-400">Guns Store (50+ Weapons)</h2>
        <div id="guns-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
      </section>

      <!-- Characters Panel -->
      <section id="panel-chars" class="panel-content glass rounded-xl p-4 hidden">
        <h2 class="text-xl font-bold mb-4 text-purple-400">Character Upgrades</h2>
        <div id="chars-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
      </section>

      <!-- Bot Panel -->
      <section id="panel-bot" class="panel-content glass rounded-xl p-4 hidden flex justify-center">
        <div class="glass p-6 rounded-xl text-center max-w-sm w-full">
          <h3 class="text-xl font-bold text-yellow-400 mb-2">Tactical AI Bot Army</h3>
          <p class="text-sm text-slate-300 mb-2">Buy multiple AI bots to assist you in battle!</p>
          <div class="text-lg font-bold text-emerald-400 mb-3">Owned Bots: <span id="owned-bots-count" class="text-yellow-400">0</span></div>
          <p class="font-bold mb-4 text-emerald-400">Price per Bot: 2,000 Coins</p>
          <button id="buy-bot-btn" onclick="buyBot()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-2 rounded-lg font-bold">Buy AI Bot (+1)</button>
        </div>
      </section>
    </main>

    <!-- In-Game Combat HUD Overlay -->
    <div id="combat-hud" class="w-full flex justify-between items-end p-2 interactive hidden">
      <!-- Movement Controls -->
      <div class="flex flex-col items-center gap-1 glass p-2 rounded-2xl">
        <button ontouchstart="keys.w=true" ontouchend="keys.w=false" onmousedown="keys.w=true" onmouseup="keys.w=false" class="bg-slate-700/80 active:bg-amber-500 w-12 h-12 rounded-lg font-bold text-xl flex items-center justify-center">▲</button>
        <div class="flex gap-1">
          <button ontouchstart="keys.a=true" ontouchend="keys.a=false" onmousedown="keys.a=true" onmouseup="keys.a=false" class="bg-slate-700/80 active:bg-amber-500 w-12 h-12 rounded-lg font-bold text-xl flex items-center justify-center">◄</button>
          <button ontouchstart="keys.s=true" ontouchend="keys.s=false" onmousedown="keys.s=true" onmouseup="keys.s=false" class="bg-slate-700/80 active:bg-amber-500 w-12 h-12 rounded-lg font-bold text-xl flex items-center justify-center">▼</button>
          <button ontouchstart="keys.d=true" ontouchend="keys.d=false" onmousedown="keys.d=true" onmouseup="keys.d=false" class="bg-slate-700/80 active:bg-amber-500 w-12 h-12 rounded-lg font-bold text-xl flex items-center justify-center">►</button>
        </div>
      </div>

      <!-- Health & Ammo Stats -->
      <div class="glass p-3 rounded-lg flex flex-col gap-1 min-w-[160px]">
        <div class="flex justify-between items-center text-xs text-slate-300">
          <span>HP Bar</span>
          <span id="hp-text" class="font-bold text-emerald-400">200/200</span>
        </div>
        <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
          <div id="hp-bar" class="bg-emerald-500 h-full w-full transition-all duration-200"></div>
        </div>
        <div class="flex justify-between items-center text-xs text-slate-300 mt-2">
          <span>Ammo:</span>
          <b id="ammo-count" class="text-yellow-400 text-sm">30 / ∞</b>
        </div>
        <span class="text-xs text-slate-300 mt-1">Enemies Left: <b id="combat-enemies-count" class="text-red-400">0</b></span>
      </div>

      <!-- Action Buttons (Fire, Reload, Special) -->
      <div class="flex items-center gap-2">
        <button onclick="reloadWeapon()" class="bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold p-4 rounded-2xl text-xs shadow-lg">RELOAD 🔄</button>
        <button id="mgun-btn" onclick="fireMGunSpecial()" class="bg-red-600 hover:bg-red-700 active:scale-95 px-4 py-4 rounded-xl font-extrabold text-xs shadow-lg hidden">M-GUN (50% CLEAR)</button>
        <button id="fire-btn" onclick="shootWeapon()" class="bg-red-600 hover:bg-red-500 active:bg-yellow-500 text-white font-black px-10 py-6 rounded-3xl text-2xl shadow-2xl active:scale-90 transition transform border-2 border-red-400">FIRE 🎯</button>
      </div>
    </div>
  </div>

  <!-- User Login Overlay Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 interactive">
    <div class="glass p-6 rounded-2xl max-w-md w-full text-center">
      <h2 class="text-2xl font-bold mb-2 text-emerald-400">Enter Player Name</h2>
      <input type="text" id="username-input" placeholder="Enter Name..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mb-4 text-center focus:outline-none focus:border-emerald-500" />
      <button onclick="authenticateUser()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-3 rounded-xl font-bold transition">Start Game</button>
    </div>
  </div>

  <!-- Diamond / Premium Choice Overlay Modal -->
  <div id="diamond-modal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 interactive hidden">
    <div class="glass p-6 rounded-2xl max-w-sm w-full text-center flex flex-col gap-3">
      <h3 class="text-lg font-bold text-cyan-400">Premium Diamond Options</h3>
      <button onclick="handleWriteID()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-semibold border border-slate-700">Write Secret ID</button>
      <button onclick="handleBuyID()" class="bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold">Buy ID</button>
      <button onclick="closeDiamondModal()" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 py-2 rounded-xl text-xs font-semibold">Cancel</button>
    </div>
  </div>

  <!-- Full Screen Iframe Modal -->
  <div id="iframe-modal" class="fixed inset-0 bg-black z-50 interactive hidden">
    <button onclick="closeIframeModal()" class="absolute top-4 right-4 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg z-50 shadow-lg">Close (X)</button>
    <iframe id="target-iframe" src="" class="w-full h-full border-none"></iframe>
  </div>

  <!-- Game Logic Engine Script -->
  <script>
    const STORAGE_KEY = "3d_tps_offline_game_state";
    let state = {
      username: "",
      coins: 1000,
      diamonds: 0,
      completedStages: [],
      activeStage: 1,
      equippedGun: "AK-47",
      ownedGuns: ["AK-47"],
      equippedChar: 1,
      ownedChars: [1],
      botCount: 0,
      mGunFiredThisMatch: false
    };

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { state = { ...state, ...JSON.parse(saved) }; } catch (e) { console.error(e); }
      }
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateUI();
    }

    function generateGunSecretID(gunName) {
      const uname = (state.username || "player").toLowerCase();
      const gname = gunName.toLowerCase().replace(/[^a-z0-9]/g, '');
      return `${uname}mt${uname}${uname.length}${gname}`;
    }

    const gunsDB = [
      { name: "AK-47", damage: 25, magazine: 30, price: 0, currency: "coins" },
      { name: "MP40", damage: 20, magazine: 40, price: 2500, currency: "coins" },
      { name: "MP5", damage: 30, magazine: 35, price: 5000, currency: "coins" },
      { name: "AN94", damage: 65, magazine: 30, price: 50000, currency: "coins" },
      { name: "XM8", damage: 60, magazine: 35, price: 50000, currency: "coins" },
      { name: "M4A1", damage: 55, magazine: 30, price: 50000, currency: "coins" },
      { name: "AWM", damage: 200, magazine: 5, price: 0, currency: "diamond_special" },
      { name: "M-Gun", damage: 500, magazine: 100, price: 0, currency: "diamond_special" }
    ];

    const charsDB = [
      { id: 1, name: "Desert Warrior", hp: 200, price: 0, color: 0x00f3ff },
      { id: 2, name: "Sand Titan", hp: 200, price: 5000, color: 0xeab308 },
      { id: 3, name: "Desert Ranger", hp: 200, price: 10000, color: 0x10b981 }
    ];

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener("keydown", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.w = true;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.a = true;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.s = true;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.d = true;
      if (e.key === " ") shootWeapon();
      if (e.key === "r" || e.key === "R") reloadWeapon();
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.w = false;
      if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.a = false;
      if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.s = false;
      if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.d = false;
    });

    function authenticateUser() {
      const input = document.getElementById("username-input").value.trim();
      if (!input) return alert("Please enter a valid name");

      state.username = input;
      saveState();
      document.getElementById("auth-modal").classList.add("hidden");
      document.getElementById("main-header").classList.remove("hidden");
      document.getElementById("main-nav").classList.remove("hidden");
      document.getElementById("panel-container").classList.remove("hidden");

      initUI();
      initThreeJS();
    }

    function updateUI() {
      document.getElementById("hud-username").innerText = state.username || "Player";
      document.getElementById("hud-coins").innerText = state.coins;
      document.getElementById("hud-diamonds").innerText = state.diamonds;
      document.getElementById("hud-char-hp").innerText = `HP: 200`;

      const botCountElem = document.getElementById("owned-bots-count");
      if (botCountElem) botCountElem.innerText = state.botCount || 0;
    }

    function initUI() {
      updateUI();
      renderStages();
      renderGuns();
      renderChars();
    }

    function openPanel(panelName) {
      document.querySelectorAll(".panel-content").forEach(p => p.classList.add("hidden"));
      document.getElementById(`panel-${panelName}`).classList.remove("hidden");
    }

    function renderStages() {
      const grid = document.getElementById("stages-grid");
      grid.innerHTML = "";
      const maxCompleted = state.completedStages.length > 0 ? Math.max(...state.completedStages) : 0;
      const unlockedStageLimit = maxCompleted + 1;

      for (let i = 1; i <= 100; i++) {
        const isWon = state.completedStages.includes(i);
        const isUnlocked = i <= unlockedStageLimit;

        const card = document.createElement("div");
        card.className = `glass p-3 rounded-xl text-center flex flex-col justify-between gap-2 border ${isUnlocked ? 'border-amber-600/40' : 'border-slate-800 opacity-50'}`;
        
        let buttonHTML = isUnlocked 
          ? `<button onclick="launchMatch(${i})" class="bg-amber-600 hover:bg-amber-500 text-xs py-1.5 rounded-lg font-bold">${isWon ? 'Replay (100🪙)' : 'Play (500🪙)'}</button>`
          : `<button disabled class="bg-slate-800 text-slate-500 text-xs py-1.5 rounded-lg font-bold cursor-not-allowed">🔒 Locked</button>`;

        card.innerHTML = `
          <div>
            <div class="font-bold text-sm text-amber-300">Stage ${i}</div>
            <div class="text-xs text-slate-400">Enemies: ${i}</div>
          </div>
          ${buttonHTML}
        `;
        grid.appendChild(card);
      }
    }

    function renderGuns() {
      const grid = document.getElementById("guns-grid");
      grid.innerHTML = "";
      gunsDB.forEach(gun => {
        const isOwned = state.ownedGuns.includes(gun.name);
        const isEquipped = state.equippedGun === gun.name;
        const card = document.createElement("div");
        card.className = "glass p-3 rounded-xl flex flex-col justify-between gap-2 border border-slate-700/60";

        let actionBtn = "";
        if (isEquipped) {
          actionBtn = `<button disabled class="w-full bg-blue-600/50 text-white text-xs py-1.5 rounded-lg font-bold">Equipped</button>`;
        } else if (isOwned) {
          actionBtn = `<button onclick="equipGun('${gun.name}')" class="w-full bg-blue-600 hover:bg-blue-500 text-xs py-1.5 rounded-lg font-bold">Equip</button>`;
        } else if (gun.currency === "diamond_special") {
          actionBtn = `<button onclick="triggerDiamondPurchaseModal()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-xs py-1.5 rounded-lg font-bold">Unlock Weapon</button>`;
        } else {
          actionBtn = `<button onclick="buyGun('${gun.name}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-xs py-1.5 rounded-lg font-bold">Buy (${gun.price}🪙)</button>`;
        }

        card.innerHTML = `
          <div>
            <div class="font-bold text-sm text-cyan-300">${gun.name}</div>
            <div class="text-xs text-slate-400">Damage: <b class="text-red-400">${gun.damage}</b></div>
          </div>
          ${actionBtn}
        `;
        grid.appendChild(card);
      });
    }

    function equipGun(gunName) {
      state.equippedGun = gunName;
      saveState();
      renderGuns();
    }

    function buyGun(gunName) {
      const gun = gunsDB.find(g => g.name === gunName);
      if (gun && state.coins >= gun.price) {
        state.coins -= gun.price;
        state.ownedGuns.push(gunName);
        state.equippedGun = gunName;
        saveState();
        renderGuns();
      } else {
        alert("Not enough coins!");
      }
    }

    function renderChars() {
      const grid = document.getElementById("chars-grid");
      grid.innerHTML = "";
      charsDB.forEach(c => {
        const isOwned = state.ownedChars.includes(c.id);
        const isEquipped = state.equippedChar === c.id;
        const card = document.createElement("div");
        card.className = "glass p-3 rounded-xl flex flex-col justify-between gap-2 border border-purple-500/30";

        let btn = "";
        if (isEquipped) {
          btn = `<button disabled class="w-full bg-purple-600/50 text-white text-xs py-1.5 rounded-lg font-bold">Selected</button>`;
        } else if (isOwned) {
          btn = `<button onclick="equipChar(${c.id})" class="w-full bg-purple-600 hover:bg-purple-500 text-xs py-1.5 rounded-lg font-bold">Select</button>`;
        } else {
          btn = `<button onclick="buyChar(${c.id})" class="w-full bg-emerald-500 hover:bg-emerald-600 text-xs py-1.5 rounded-lg font-bold">Unlock (${c.price}🪙)</button>`;
        }

        card.innerHTML = `
          <div>
            <div class="font-bold text-sm text-purple-300">${c.name}</div>
            <div class="text-xs text-slate-400">HP: <b class="text-emerald-400">200</b></div>
          </div>
          ${btn}
        `;
        grid.appendChild(card);
      });
    }

    function equipChar(id) {
      state.equippedChar = id;
      saveState();
      renderChars();
      if (isMatchActive) rebuildPlayerCharacter();
    }

    function buyChar(id) {
      const charData = charsDB.find(c => c.id === id);
      if (charData && state.coins >= charData.price) {
        state.coins -= charData.price;
        state.ownedChars.push(id);
        state.equippedChar = id;
        saveState();
        renderChars();
      } else {
        alert("Not enough coins!");
      }
    }

    function buyBot() {
      if (state.coins >= 2000) {
        state.coins -= 2000;
        state.botCount = (state.botCount || 0) + 1;
        saveState();
        alert(`AI Bot purchased! Total Active Bots: ${state.botCount}`);
      } else {
        alert("Bot requires 2,000 Coins!");
      }
    }

    function triggerDiamondPurchaseModal() { document.getElementById("diamond-modal").classList.remove("hidden"); }
    function closeDiamondModal() { document.getElementById("diamond-modal").classList.add("hidden"); }

    function handleWriteID() {
      closeDiamondModal();
      const input = prompt("Enter Secret ID:");
      if (!input) return;

      const trimmedInput = input.trim().toLowerCase();
      let matchedGun = gunsDB.find(g => generateGunSecretID(g.name) === trimmedInput);

      if (matchedGun) {
        alert(`Secret ID Verified! Unlocked Premium Gun: ${matchedGun.name}`);
        state.diamonds += 100;
        if (!state.ownedGuns.includes(matchedGun.name)) state.ownedGuns.push(matchedGun.name);
        state.equippedGun = matchedGun.name;
        saveState();
        renderGuns();
      } else {
        alert("Incorrect Secret ID.");
      }
    }

    function handleBuyID() {
      closeDiamondModal();
      const modal = document.getElementById("iframe-modal");
      const iframe = document.getElementById("target-iframe");
      iframe.src = "https://muhammad-taqi512-lyra.hf.space";
      modal.classList.remove("hidden");
    }

    function closeIframeModal() {
      const modal = document.getElementById("iframe-modal");
      const iframe = document.getElementById("target-iframe");
      iframe.src = "";
      modal.classList.add("hidden");
    }

    // --- THREE.JS GAME ENGINE & COMBAT SYSTEM ---
    let scene, camera, renderer;
    let playerGroup, gunMesh, muzzleFlashLight;
    let botEntities = [];
    let enemyEntities = [];
    let activeBullets = [];

    let isMatchActive = false;
    let currentMatchStage = 1;
    let playerCurrentHP = 200;
    let currentAmmo = 30;
    let maxAmmo = 30;
    const EQUAL_MAX_HP = 200;

    function initThreeJS() {
      const container = document.getElementById("canvas-container");
      scene = new THREE.Scene();

      // Background Texture Loader
      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = "Anonymous";
      textureLoader.load("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfR171h22b9SpoLPVcYgfmKbcDT25UmcPLZR5rFxvjyg&s=10", (texture) => {
        scene.background = texture;
      });

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 7, 14);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
      sunLight.position.set(30, 40, 20);
      sunLight.castShadow = true;
      scene.add(sunLight);

      buildGround();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function buildGround() {
      const groundGeo = new THREE.PlaneGeometry(500, 500, 32, 32);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, transparent: true, opacity: 0.85 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
    }

    function createProceduralCharacter(themeColorHex, visorColorHex = 0x00f3ff) {
      const group = new THREE.Group();
      const armorMat = new THREE.MeshStandardMaterial({ color: themeColorHex, roughness: 0.3 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const visorMat = new THREE.MeshStandardMaterial({ color: visorColorHex, emissive: visorColorHex, emissiveIntensity: 0.6 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), armorMat);
      torso.position.y = 1.95;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), darkMat);
      head.position.y = 3.0;
      group.add(head);

      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.1), visorMat);
      visor.position.set(0, 3.0, 0.35);
      group.add(visor);

      // Weapon Attachment Structure
      const gunGroup = new THREE.Group();
      const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x111827 }));
      gunGroup.add(gunBody);

      muzzleFlashLight = new THREE.PointLight(0xffaa00, 0, 5);
      muzzleFlashLight.position.set(0, 0.1, -0.7);
      gunGroup.add(muzzleFlashLight);

      gunGroup.position.set(0.6, 2.0, -0.4);
      group.add(gunGroup);

      return group;
    }

    function spawnBullet(startPos, targetPos, color = 0xffff00) {
      const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: color });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);
      bullet.position.copy(startPos);
      bullet.position.y = 2.0;

      const dir = new THREE.Vector3().subVectors(targetPos, startPos).normalize();
      scene.add(bullet);
      activeBullets.push({ mesh: bullet, direction: dir, life: 50 });
    }

    function triggerMuzzleFlash() {
      if (muzzleFlashLight) {
        muzzleFlashLight.intensity = 3;
        setTimeout(() => { if (muzzleFlashLight) muzzleFlashLight.intensity = 0; }, 60);
      }
    }

    function rebuildPlayerCharacter() {
      if (playerGroup) scene.remove(playerGroup);
      const charConfig = charsDB.find(c => c.id === state.equippedChar) || charsDB[0];
      playerGroup = createProceduralCharacter(charConfig.color);
      playerGroup.position.set(0, 0, 5);
      scene.add(playerGroup);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isMatchActive && playerGroup) {
        // Player Movement Controls
        const moveSpeed = 0.2;
        if (keys.w) playerGroup.position.z -= moveSpeed;
        if (keys.s) playerGroup.position.z += moveSpeed;
        if (keys.a) playerGroup.position.x -= moveSpeed;
        if (keys.d) playerGroup.position.x += moveSpeed;

        // Camera Follow Logic
        camera.position.x = playerGroup.position.x;
        camera.position.z = playerGroup.position.z + 8;
        camera.position.y = 5.5;
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.8, playerGroup.position.z - 6);

        const currentTime = Date.now();

        // 1. AI BOTS FIRE LOGIC
        botEntities.forEach((botObj, idx) => {
          if (botObj.hp > 0) {
            const targetX = playerGroup.position.x + ((idx % 2 === 0 ? 1 : -1) * (Math.floor(idx / 2) + 1) * 2);
            const targetZ = playerGroup.position.z;
            botObj.mesh.position.x += (targetX - botObj.mesh.position.x) * 0.05;
            botObj.mesh.position.z += (targetZ - botObj.mesh.position.z) * 0.05;

            if (currentTime - botObj.lastShotTime > 1000) {
              const aliveEnemy = enemyEntities.find(e => e.hp > 0);
              if (aliveEnemy) {
                spawnBullet(botObj.mesh.position, aliveEnemy.mesh.position, 0x00f3ff);
                aliveEnemy.hp -= 20;
                botObj.lastShotTime = currentTime;
                if (aliveEnemy.hp <= 0) scene.remove(aliveEnemy.mesh);
              }
            }
          }
        });

        // 2. ENEMIES AI & SHOOTING LOGIC
        enemyEntities.forEach(enemyObj => {
          if (enemyObj.hp > 0) {
            const dx = playerGroup.position.x - enemyObj.mesh.position.x;
            const dz = playerGroup.position.z - enemyObj.mesh.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist > 3) {
              enemyObj.mesh.position.x += (dx / dist) * 0.05;
              enemyObj.mesh.position.z += (dz / dist) * 0.05;
            }

            if (currentTime - enemyObj.lastShotTime > 1100) {
              const activeBot = botEntities.find(b => b.hp > 0);
              let targetMesh = activeBot ? activeBot.mesh : playerGroup;

              spawnBullet(enemyObj.mesh.position, targetMesh.position, 0xff0000);

              if (activeBot) {
                activeBot.hp -= 15;
                if (activeBot.hp <= 0) scene.remove(activeBot.mesh);
              } else {
                playerCurrentHP -= 15;
                updateHealthHUD();
                if (playerCurrentHP <= 0) endMatch(false);
              }
              enemyObj.lastShotTime = currentTime;
            }
          }
        });

        // 3. BULLETS MOTION & TRAJECTORY
        for (let i = activeBullets.length - 1; i >= 0; i--) {
          const b = activeBullets[i];
          b.mesh.position.addScaledVector(b.direction, 1.0);
          b.life--;
          if (b.life <= 0) {
            scene.remove(b.mesh);
            activeBullets.splice(i, 1);
          }
        }

        checkStageClearCondition();
      }

      renderer.render(scene, camera);
    }

    function launchMatch(stageNum) {
      currentMatchStage = stageNum;
      state.activeStage = stageNum;
      state.mGunFiredThisMatch = false;

      const currentGunData = gunsDB.find(g => g.name === state.equippedGun) || gunsDB[0];
      maxAmmo = currentGunData.magazine || 30;
      currentAmmo = maxAmmo;
      updateAmmoHUD();

      document.getElementById("main-nav").classList.add("hidden");
      document.getElementById("panel-container").classList.add("hidden");
      document.getElementById("combat-hud").classList.remove("hidden");
      document.getElementById("crosshair").classList.remove("hidden");

      if (state.equippedGun === "M-Gun") {
        document.getElementById("mgun-btn").classList.remove("hidden");
      } else {
        document.getElementById("mgun-btn").classList.add("hidden");
      }

      playerCurrentHP = EQUAL_MAX_HP;
      updateHealthHUD();

      // Clear Active Battlefield
      botEntities.forEach(b => scene.remove(b.mesh));
      botEntities = [];
      enemyEntities.forEach(e => scene.remove(e.mesh));
      enemyEntities = [];
      activeBullets.forEach(b => scene.remove(b.mesh));
      activeBullets = [];

      rebuildPlayerCharacter();

      // Spawn Player AI Bots
      const totalBots = state.botCount || 0;
      for (let i = 0; i < totalBots; i++) {
        const bMesh = createProceduralCharacter(0x3b82f6, 0x60a5fa);
        bMesh.position.set(playerGroup.position.x + (i + 1) * 2, 0, playerGroup.position.z);
        scene.add(bMesh);
        botEntities.push({ mesh: bMesh, hp: EQUAL_MAX_HP, lastShotTime: Date.now() + (i * 200) });
      }

      const baseDistance = 12 + (stageNum * 3); 

      // Spawn Enemy Squads
      for (let i = 0; i < stageNum; i++) {
        const eMesh = createProceduralCharacter(0xdc2626, 0xff0000);
        eMesh.rotation.y = Math.PI;

        const row = Math.floor(i / 6);
        const col = i % 6;
        eMesh.position.set(-10 + (col * 3.5), 0, -baseDistance - (row * 4));
        scene.add(eMesh);

        enemyEntities.push({ mesh: eMesh, hp: EQUAL_MAX_HP, lastShotTime: Date.now() + (i * 150) });
      }

      document.getElementById("combat-enemies-count").innerText = enemyEntities.length;
      isMatchActive = true;
    }

    // MAIN FIRING ACTION
    function shootWeapon() {
      if (!isMatchActive) return;

      if (currentAmmo <= 0) {
        reloadWeapon();
        return;
      }

      currentAmmo--;
      updateAmmoHUD();
      triggerMuzzleFlash();

      const equipped = gunsDB.find(g => g.name === state.equippedGun) || gunsDB[0];
      const damage = equipped.damage;

      // Target closest active enemy
      const target = enemyEntities.find(e => e.hp > 0);
      if (target) {
        spawnBullet(playerGroup.position, target.mesh.position, 0xfacc15);
        target.hp -= damage;

        // Visual recoil bounce
        playerGroup.position.z += 0.05;
        setTimeout(() => { playerGroup.position.z -= 0.05; }, 50);

        if (target.hp <= 0) scene.remove(target.mesh);
      } else {
        // Shoot straight ahead if no targets left
        const forwardTarget = new THREE.Vector3().copy(playerGroup.position).add(new THREE.Vector3(0, 0, -20));
        spawnBullet(playerGroup.position, forwardTarget, 0xfacc15);
      }

      checkStageClearCondition();
    }

    function reloadWeapon() {
      if (!isMatchActive) return;
      currentAmmo = maxAmmo;
      updateAmmoHUD();
    }

    function updateAmmoHUD() {
      document.getElementById("ammo-count").innerText = `${currentAmmo} / ∞`;
    }

    function fireMGunSpecial() {
      if (!isMatchActive || state.mGunFiredThisMatch) return;

      state.mGunFiredThisMatch = true;
      document.getElementById("mgun-btn").classList.add("hidden");

      const activeEnemies = enemyEntities.filter(e => e.hp > 0);
      const eliminateCount = Math.ceil(activeEnemies.length / 2);

      for (let i = 0; i < eliminateCount; i++) {
        if (activeEnemies[i]) {
          activeEnemies[i].hp = 0;
          scene.remove(activeEnemies[i].mesh);
        }
      }

      checkStageClearCondition();
    }

    function checkStageClearCondition() {
      const activeEnemies = enemyEntities.filter(e => e.hp > 0);
      document.getElementById("combat-enemies-count").innerText = activeEnemies.length;

      if (activeEnemies.length === 0 && isMatchActive) {
        endMatch(true);
      }
    }

    function updateHealthHUD() {
      const percent = Math.max(0, (playerCurrentHP / EQUAL_MAX_HP) * 100);
      document.getElementById("hp-bar").style.width = `${percent}%`;
      document.getElementById("hp-text").innerText = `${Math.max(0, playerCurrentHP)}/${EQUAL_MAX_HP}`;
    }

    function endMatch(victory) {
      isMatchActive = false;
      document.getElementById("combat-hud").classList.add("hidden");
      document.getElementById("crosshair").classList.add("hidden");
      document.getElementById("main-nav").classList.remove("hidden");
      document.getElementById("panel-container").classList.remove("hidden");

      if (victory) {
        const isFirstWin = !state.completedStages.includes(currentMatchStage);
        const reward = isFirstWin ? 500 : 100;

        if (isFirstWin) state.completedStages.push(currentMatchStage);
        state.coins += reward;
        saveState();

        alert(`VICTORY! Stage ${currentMatchStage} Cleared!\nEarned: ${reward} Coins`);
      } else {
        alert("DEFEAT! Health depleted.");
      }

      renderStages();
    }

    window.onload = () => {
      loadState();
      if (state.username) {
        document.getElementById("auth-modal").classList.add("hidden");
        document.getElementById("main-header").classList.remove("hidden");
        document.getElementById("main-nav").classList.remove("hidden");
        document.getElementById("panel-container").classList.remove("hidden");
        initUI();
        initThreeJS();
      }
    };
  </script>
</body>
</html>
